<!DOCTYPE html>
<html lang="ko">
<head>

<title>성운 시뮬레이터</title>
<style>
:root{--bg:#070a1f;--panel:#11163a;--panel2:#1a2050;--ink:#eef0ff;--muted:#a3abdf;--gold:#f4b942;--violet:#8e6bff;--teal:#2cb1bc;--red:#ff5d73;--blue:#7fb2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button,.btn{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--panel2);cursor:pointer}
.tabs button.on{background:var(--violet)}
.btn{display:block;width:100%;text-align:left;border-radius:12px;margin:8px 0}
.btn.on{background:var(--teal);color:#021d20}
.btn:disabled{opacity:.45;cursor:default}
main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:0 16px 16px;height:calc(100% - 62px)}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}.stage{height:62vh}}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:380px;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.inset{position:absolute;right:12px;bottom:12px;width:36%;aspect-ratio:4/3;border:2px solid var(--gold);border-radius:12px;overflow:hidden;background:#000}
.inset canvas{position:absolute;inset:0;width:100%;height:100%}
.inset .tag{position:absolute;left:0;top:0;right:0;padding:5px 10px;font-size:14px;font-weight:800;background:rgba(7,10,31,.75);color:var(--gold)}
.inset .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--muted);background:#05071a}
.hint{position:absolute;left:12px;top:10px;font-size:13px;color:var(--muted);pointer-events:none}
.reset{position:absolute;left:12px;bottom:12px;border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:rgba(26,32,80,.85);cursor:pointer}
aside{background:var(--panel);border-radius:14px;padding:16px;overflow:auto;line-height:1.6;font-size:15px}

.name{display:none;margin-top:10px;border-left:4px solid var(--gold);padding:6px 10px;background:#0b0f2b;border-radius:6px}
.name.show{display:block}
.name .big{font-size:22px;font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
body{display:flex;flex-direction:column;min-height:100svh}
main{flex:1;min-height:0;height:auto;grid-template-columns:minmax(0,1fr) 340px}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button{touch-action:manipulation}
[hidden]{display:none!important}
.explore{grid-template-columns:minmax(0,1fr) 370px}
.explore aside{display:flex;flex-direction:column;padding:12px;overflow:hidden}
.eye-screen{position:relative;flex:none;border:2px solid var(--gold);border-radius:12px;overflow:hidden;background:#000}
.eye-screen h2{font-size:15px;padding:7px 10px;margin:0;background:#1a1830}
.eye-screen canvas{display:block;width:100%;height:200px;touch-action:pan-y}
.eye-caption{font-size:12px;color:var(--muted);margin:5px 0}
.free-controls{overflow:auto;min-height:0;padding:0 3px 8px;scrollbar-width:thin}

.free-controls select{max-width:100%;width:100%;min-height:44px;color:var(--ink);background:#080d29;border:1px solid #485385;border-radius:8px;padding:7px}

.free-controls input[type=range]{width:100%;min-height:30px;accent-color:var(--teal);touch-action:pan-y}
.free-controls input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--teal)}
.axis-control{display:grid;grid-template-columns:58px 1fr 36px;align-items:center;gap:6px}
.axis-control output{font-size:12px;text-align:right;color:var(--muted)}
.free-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.free-row>*{flex:1;min-width:0}
.free-row label{flex:initial}
.free-controls details{border-top:1px solid #303862;margin-top:8px;padding-top:8px}
.free-controls summary{cursor:pointer;min-height:40px;display:list-item;font-weight:700;color:var(--gold)}
.free-tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.free-tools button{border:1px solid #535e94;background:rgba(17,22,58,.96);border-radius:12px;color:var(--ink);padding:10px 13px;min-height:46px;font-weight:700;cursor:pointer}
.free-tools button.active{background:var(--teal);color:#031c20;border-color:var(--teal)}
.free-tools .zoom{margin-left:auto;display:flex;gap:5px}

.challenge-result{color:#7be3c6;font-weight:700;font-size:14px;min-height:24px;margin-top:6px}
.free-controls .note{margin-top:10px;line-height:1.5}
.scene-picker{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:6px;align-items:center;margin:8px 0}
.scene-picker button{border:0;border-radius:8px;min-height:44px;background:#2a3060;color:var(--ink);cursor:pointer;font-weight:700}
@media(min-width:901px){body{height:100svh}header{flex:none}.explore .stage{min-height:0}}
@media(max-width:1100px) and (min-width:901px){h1{font-size:17px}.tabs{gap:5px}.tabs button{padding:10px;font-size:13px}.explore{grid-template-columns:minmax(0,1fr) 330px}}
@media(max-width:900px){body{height:auto}main,.explore{grid-template-columns:minmax(0,1fr)}header{padding:10px}.tabs{gap:5px}.tabs button{font-size:13px;padding:10px 12px}main{padding:0 10px 12px}.stage{height:58svh;min-height:370px}.explore aside{overflow:visible}.free-controls{overflow:visible}.eye-screen canvas{height:240px}.free-tools{gap:5px}.free-tools button{font-size:12px;padding:9px}.free-tools .zoom button{font-size:17px}.free-help{font-size:12px}.free-help b{font-size:15px}}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin:12px 0 4px}
.num{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:#0b0f2b;color:var(--gold);font-size:14px;font-weight:800}
.btn .num{margin-right:8px;vertical-align:middle}
.btn.on .num{background:#021d20;color:var(--teal)}
.opts button{border:2px solid transparent;border-radius:10px;padding:10px 12px;min-height:46px;text-align:left;font-weight:700;color:var(--ink);background:#0b0f2b;cursor:pointer}
.opts button.on{border-color:var(--gold);background:#2a2550}
.btn{min-height:46px;margin:6px 0}
aside p{margin:6px 0}
.opts{gap:5px}
.opts button{min-height:42px}
.btn.ghost{background:transparent;border:1px solid #485385;text-align:center}
.next{box-shadow:0 0 0 3px var(--gold);animation:nudge 1.6s ease-in-out infinite}

.mine{font-size:13px;color:var(--gold);margin:4px 0 0}
.cards{display:grid;gap:6px;margin:6px 0}
.cards button{display:flex;align-items:center;gap:8px;border:2px solid transparent;border-radius:10px;padding:9px 10px;min-height:46px;text-align:left;font-weight:700;color:var(--ink);background:#1a2050;cursor:pointer}
.cards button.on{border-color:var(--gold);background:#2a2550}
.cards button .ok{margin-left:auto;color:#7be3c6}
.scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0}
.scenes button{border:0;border-radius:10px;padding:8px 4px;min-height:46px;font-size:13px;font-weight:700;color:var(--ink);background:#2a3060;cursor:pointer}
.sec{font-size:13px;font-weight:800;color:var(--gold);margin:12px 0 2px}
.selhead{display:flex;gap:6px;align-items:center}
.selhead select{flex:1}
.selhead button{flex:none;border:0;border-radius:8px;min-height:44px;padding:0 12px;color:var(--ink);background:#4a2338;font-weight:700;cursor:pointer}
.sitehome{margin-left:auto;color:#eef0ff;text-decoration:none;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;background:#1a2050;white-space:nowrap}
@media (min-width:901px){body{display:flex;flex-direction:column}main{flex:1;min-height:0;height:auto}}
</style>

<body>
<header>
  <h1>🌫️ 성운은 어떻게 보일까?</h1>
  <div class="tabs" id="tabs">
    <button data-c="0" class="on">① 별이 구름 안에</button>
    <button data-c="1">② 별이 구름 옆에</button>
    <button data-c="2">③ 별들이 구름 뒤에</button>
    <button data-c="3">④ 세 가지 비교</button>
    <button data-c="4">⑤ 자유 탐구</button>
  </div>
<a class="sitehome" href="./">⌂ 첫 화면</a>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">끌어서 돌려 보기 · 휠로 확대</div>
    <button class="reset" id="resetView">처음 시점으로</button>
    <div class="inset" id="inset"><canvas id="cv2"></canvas><div class="tag">🔭 지구에서 본 모습</div><div class="wait" id="wait">?</div></div>
  </div>
  <aside id="panel"></aside>
</main>
<script>
"use strict";
const CASES = [
  { tab: '별이 구름 안에', setup: '뜨거운 별이 가스·티끌 구름(성간 물질) <b>안에</b> 있어요.',
    name: '방출 성운', col: 'var(--red)',
    def: '성간 물질이 주변의 별빛을 흡수하여 가열되면서 스스로 빛을 내는 성운',
    why: '별빛을 받은 가스가 뜨거워져 <b>스스로 빛을 내요</b>. 그 빛이 지구까지 와요. 주로 붉게 보여요.',
    ex: '예: 오리온 대성운' },
  { tab: '별이 구름 옆에', setup: '별이 가스·티끌 구름(성간 물질) <b>옆에</b> 있어요.',
    name: '반사 성운', col: 'var(--blue)',
    def: '성간 물질이 주변의 별빛을 반사하여 밝게 보이는 성운',
    why: '구름은 스스로 빛을 내지 않아요. 옆에 있는 <b>별빛이 구름에 부딪혀 반사</b>되어 지구로 와요. 주로 파랗게 보여요.',
    ex: '예: 마귀할멈 성운' },
  { tab: '별들이 구름 뒤에', setup: '구름 <b>뒤쪽</b>에 별이 많고, 구름 가까이에는 밝은 별이 없어요.',
    name: '암흑 성운', col: '#c9cce3',
    def: '성간 물질이 뒤쪽에서 오는 별빛을 가로막아 어둡게 보이는 성운',
    why: '뒤쪽 별에서 오는 빛이 <b>구름에 가로막혀</b> 지구까지 오지 못해요. 그래서 그 부분만 검게 보여요.',
    ex: '예: 말머리성운, 은하수의 어두운 부분' },
];
const EARTH = [0, 0, 13];
const STAR_POS = [[0.35, 0.25, 0.2], [-4.2, 2.1, -1.2], null];

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(7);
const gauss = () => { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); };

const BLOBS = [];
for (let i = 0; i < 8; i++) {
  const r = 1.6 * Math.cbrt(R()), th = R() * 2 * Math.PI, ph = Math.acos(2 * R() - 1);
  BLOBS.push({ c: [r * Math.sin(ph) * Math.cos(th) * 1.3, r * Math.cos(ph) * 0.9, r * Math.sin(ph) * Math.sin(th)], s: 0.8 + R() * 0.6, a: 0.6 + R() * 0.6 });
}
BLOBS.push({ c: [0, 0, 0], s: 1.6, a: 1.0 });
function density(x, y, z) {
  let d = 0;
  for (const b of BLOBS) {
    const dx = x - b.c[0], dy = y - b.c[1], dz = z - b.c[2];
    d += b.a * Math.exp(-(dx * dx + dy * dy + dz * dz) / (2 * b.s * b.s));
  }
  return d;
}
const totalA = BLOBS.reduce((s, b) => s + b.a * b.s ** 3, 0);
const NC = 2400;
const cloud = [];
for (let i = 0; i < NC; i++) {
  let u = R() * totalA, b = BLOBS[0];
  for (const bb of BLOBS) { u -= bb.a * bb.s ** 3; if (u <= 0) { b = bb; break; } }
  cloud.push([b.c[0] + gauss() * b.s, b.c[1] + gauss() * b.s, b.c[2] + gauss() * b.s]);
}
function tau(p, q, k) {
  const n = 12; let t = 0;
  const L = Math.hypot(q[0] - p[0], q[1] - p[1], q[2] - p[2]);
  for (let i = 1; i <= n; i++) {
    const f = (i - 0.5) / n;
    t += density(p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, p[2] + (q[2] - p[2]) * f);
  }
  return k * t * L / n;
}
const LIGHT = [
  cloud.map((p) => { const s = STAR_POS[0]; const d = Math.hypot(p[0] - s[0], p[1] - s[1], p[2] - s[2]); return 0.12 + 0.88 * Math.exp(-d * d / (2 * 1.7 * 1.7)); }),
  cloud.map((p) => { const s = STAR_POS[1]; const d = Math.hypot(p[0] - s[0], p[1] - s[1], p[2] - s[2]); return Math.min(1, 9 / (d * d)) * Math.exp(-tau(p, s, 0.55)) * 0.95 + 0.03; }),
  cloud.map(() => 1),
];
const sky = [];
for (let i = 0; i < 700; i++) {
  const th = R() * 2 * Math.PI, ph = Math.acos(2 * R() - 1), r = 70;
  const a = 0.3 + R() * 0.7;
  sky.push([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th), a, `rgba(255,255,255,${(a * 0.6).toFixed(3)})`]);
}
const wall = [];
for (let i = 0; i < 4200; i++) {
  const bright = R() < 0.1;
  wall.push([(R() - 0.5) * 44, (R() - 0.5) * 30, -11 + (R() - 0.5) * 3, bright ? 0.7 + R() * 0.3 : 0.25 + R() * 0.35, bright]);
}

function sprite(r, g, b, a) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${r},${g},${b},${a})`); gr.addColorStop(0.45, `rgba(${r},${g},${b},${a * 0.45})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c;
}
const SPR = { red: sprite(255, 70, 100, 1), pink: sprite(255, 170, 190, 1), blue: sprite(110, 165, 255, 1), dark: sprite(26, 20, 22, 0.95), star: sprite(255, 250, 235, 1), hot: sprite(200, 225, 255, 1), earth: sprite(70, 150, 255, 1) };

function camera(pos, target, fov, w, h) {
  const f = [target[0] - pos[0], target[1] - pos[1], target[2] - pos[2]];
  const fl = Math.hypot(...f) || 1; f[0] /= fl; f[1] /= fl; f[2] /= fl;
  if (!f.some(Boolean)) f[2] = -1;
  const r = Math.abs(f[1]) > 0.999 ? [1, 0, 0] : [-f[2], 0, f[0]]; const rl = Math.hypot(...r) || 1; r[0] /= rl; r[1] /= rl; r[2] /= rl;
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  const k = (h / 2) / Math.tan(fov / 2);
  return {
    k, w, h, pos, f, r, u,
    p(q) {
      const d = [q[0] - pos[0], q[1] - pos[1], q[2] - pos[2]];
      const z = d[0] * f[0] + d[1] * f[1] + d[2] * f[2];
      if (z <= 0.1) return null;
      return [w / 2 + k * (d[0] * r[0] + d[1] * r[1] + d[2] * r[2]) / z, h / 2 - k * (d[0] * u[0] + d[1] * u[1] + d[2] * u[2]) / z, z];
    },
  };
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), mctx = ctx;
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
let layerKey = '', insetKey = '', compKey = '';
const cv2 = document.getElementById('cv2'), ctx2 = cv2.getContext('2d');
const stage = document.getElementById('stage'), inset = document.getElementById('inset');
const VIEW0 = { yaw: 0.85, pitch: 0.28, dist: 20, tx: 1.5, ty: -1.2, tz: 4.5 };
let view = Object.assign({}, VIEW0);
let cur = 0;
const state = { earth: false, rays: false, name: false, pick: null };

function fit(c) {
  const r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  return dpr;
}

function drawScene(g, cam, ci, o) {
  const W = cam.w, H = cam.h, dpr = o.dpr;
  g.fillStyle = '#000'; g.fillRect(o.x0 || 0, 0, W, H);
  g.save(); g.translate(o.x0 || 0, 0); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  g.globalCompositeOperation = 'source-over';
  for (const s of sky) {
    const q = cam.p(s); if (!q) continue;
    g.fillStyle = s[4]; g.fillRect(q[0], q[1], 1.3 * dpr, 1.3 * dpr);
  }
  const items = [];
  const wallFirst = ci === 2 && cam.pos[2] > -8;
  if (wallFirst) {
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = '#fffaeb';
    for (const s of wall) {
      const q = cam.p(s); if (!q) continue;
      g.globalAlpha = s[3];
      if (s[4]) { const sz = 2.4 * dpr; g.drawImage(SPR.star, q[0] - sz * 2, q[1] - sz * 2, sz * 4, sz * 4); }
      else { const sz = 1.6 * dpr; g.fillRect(q[0] - sz / 2, q[1] - sz / 2, sz, sz); }
    }
  } else if (ci === 2) wall.forEach((s) => { const q = cam.p(s); if (q) items.push([q[2], 0, q, s]); });
  cloud.forEach((p, i) => { const q = cam.p(p); if (q) items.push([q[2], 1, q, i]); });
  const st = STAR_POS[ci];
  if (st) { const q = cam.p(st); if (q) items.push([q[2] - 0.001, 2, q]); }
  if (o.earth) { const q = cam.p(EARTH); if (q) items.push([q[2], 3, q]); }
  if (ci === 2) items.sort((a, b) => b[0] - a[0]);
  const L = LIGHT[ci];
  for (const it of items) {
    const q = it[2];

  const quality=document.getElementById('freeQuality');quality.value=free.quality;quality.onchange=e=>{free.quality=+e.target.value;freeChanged(false);};
  document.getElementById('freeCards').onclick=e=>{const b=e.target.closest('[data-ch]');if(!b)return;free.challenge=free.challenge===b.dataset.ch?'':b.dataset.ch;free.history.clear();
    document.querySelectorAll('#freeCards [data-ch]').forEach(x=>{x.classList.toggle('on',x.dataset.ch===free.challenge);x.setAttribute('aria-pressed',x.dataset.ch===free.challenge);});
    document.getElementById('freeChallengeHint').textContent=challengeHint();updateFreeFeedback();};
  document.getElementById('freeChallengeHint').textContent=challengeHint();
  panel.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>loadFreeScene(b.dataset.scene));
  document.getElementById('freeReset').onclick=()=>{free.won.clear();free.challenge='';loadFreeScene('start');};
  syncFreeSelection();free.dirty=true;invalidate();
}
freeTools.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tool){const type=b.dataset.tool,eye=free.objects.find(o=>o.type==='eye');if(type==='eye'&&eye){free.tool='';freeTools.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('active'));selectFree(eye.id);freeMessageText('내 위치의 손잡이를 끌어 옮겨 보세요.');return;}free.tool=free.tool===type?'':type;freeTools.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===free.tool));freeMessageText(free.tool?freeNames[type]+'을 놓을 곳을 눌러 주세요.':'물체를 끌어 옮기거나 빈 곳을 끌어 돌려 보세요.');}
  if(b.dataset.zoom){view.dist=clamp(view.dist*+b.dataset.zoom,12,65);invalidate();}
  if(b.id==='freeViewReset'){view={...FREE_VIEW};invalidate();}
};
const panel = document.getElementById('panel');
function render() {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', +b.dataset.c === cur));
  document.querySelector('main').classList.toggle('explore',cur===4);
  freeTools.hidden=freeHelp.hidden=freeMessage.hidden=cur!==4;
  inset.style.display = cur < 3 ? '' : 'none';
  document.getElementById('hint').style.display = cur < 3 ? '' : 'none';
  document.getElementById('resetView').style.display = cur < 3 ? '' : 'none';
  document.getElementById('wait').style.display = state.earth ? 'none' : '';
  invalidate();
  if(cur===4){renderFreePanel();return;}
  if (cur === 3) {
    panel.innerHTML = `<h2>세 가지 성운 비교</h2>
      <p>세 화면 모두 <b>지구에서 본 모습</b>이에요. 모두 가스·티끌(성간 물질)이 모인 구름인데, 별빛과 구름의 위치에 따라 다르게 보여요.</p>
      <button class="btn ${state.name ? 'on' : ''}" id="bName">🏷️ 이름 보기</button>
      ${CASES.map((c) => `<div class="name ${state.name ? 'show' : ''}" style="border-color:${c.col}"><div class="big" style="color:${c.col}">${c.name}</div>${c.def}</div>`).join('')}
      <button class="btn ghost" id="bNext">다음: ⑤ 자유 탐구 → 직접 만들어 보기</button>
      <div class="note">이 화면은 원리를 보여 주는 모형이에요. 실제 크기와 거리, 색은 다를 수 있어요.</div>`;
    document.getElementById('bNext').onclick = () => go(4);
  } else {
    const c = CASES[cur], OPTS = ['붉게 빛난다', '파르스름하게 밝다', '검게 보인다'];
    const nx = state.pick === null ? 'pick' : !state.earth ? 'earth' : !state.rays ? 'rays' : !state.name ? 'name' : 'next';
    const nextTab = cur < 2 ? `${['②', '③'][cur]} ${CASES[cur + 1].tab}` : '④ 세 가지 비교';
    panel.innerHTML = `<h2>${['①', '②', '③'][cur]} ${c.tab}</h2>
      <p>${c.setup}</p>
      <div class="step"><span class="num">1</span>예상해 보기: 지구에서는 이 구름이 어떻게 보일까요?</div>
      <div class="opts ${nx === 'pick' ? 'next' : ''}" style="border-radius:12px">${OPTS.map((t, i) => `<button data-pick="${i}" class="${state.pick === i ? 'on' : ''}" aria-pressed="${state.pick === i}">${i + 1}. ${t}</button>`).join('')}</div>
      <button class="btn ${state.earth ? 'on' : ''} ${nx === 'earth' ? 'next' : ''}" id="bEarth"><span class="num">2</span>🔭 지구에서 본 모습 보기</button>
      ${state.earth && state.pick !== null ? `<p class="mine">내 예상: ${state.pick + 1}. ${OPTS[state.pick]} · 오른쪽 아래 화면과 비교해 보세요.</p>` : ''}
      <button class="btn ${state.rays ? 'on' : ''} ${nx === 'rays' ? 'next' : ''}" id="bRays"><span class="num">3</span>✨ 빛의 경로 보기</button>
      ${state.rays ? `<div class="legend">${cur === 2 ? '노란 빛: 구름 뒤쪽 별빛 · 구름 속에서 흐려지다 ✕ (지구까지 못 와요)' : cur === 0 ? '흰 빛: 별빛 → 붉은 빛: 가스가 스스로 낸 빛' : '노란 빛: 별빛 → 파란 빛: 구름에 반사된 빛'}</div><p>${c.why}</p>` : ''}
      <button class="btn ${state.name ? 'on' : ''} ${nx === 'name' ? 'next' : ''}" id="bName"><span class="num">4</span>🏷️ 이름 보기</button>
      <div class="name ${state.name ? 'show' : ''}" style="border-color:${c.col}"><div class="big" style="color:${c.col}">${c.name}</div>${c.def}<div class="legend">${c.ex}</div></div>
      <button class="btn ghost ${nx === 'next' ? 'next' : ''}" id="bNext">다음: ${nextTab} →</button>
      <div class="note">화면을 끌면 돌아가요 · 휠이나 두 손가락으로 확대해요<br>이 화면은 원리를 보여 주는 모형이에요. 실제 크기와 거리, 색은 다를 수 있어요.</div>`;
    panel.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => { state.pick = +b.dataset.pick; render(); });
    document.getElementById('bEarth').onclick = () => { state.earth = !state.earth; render(); };
    document.getElementById('bRays').onclick = () => { state.rays = !state.rays; photons = []; render(); };
    document.getElementById('bNext').onclick = () => go(cur + 1);
  }
  document.getElementById('bName').onclick = () => { state.name = !state.name; render(); };
}
function go(c) {
  cur = c; state.earth = false; state.rays = false; state.name = false; state.pick = null; photons = []; view = Object.assign({}, VIEW0);
  history.replaceState(null, '', '#' + (c + 1));
  if(cur===4){view={...FREE_VIEW};free.tool='';freeTools.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('active'));if(!free.objects.length)loadFreeScene('start');}
  render();
}
document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => go(+b.dataset.c));
document.getElementById('resetView').onclick = () => { view = Object.assign({}, VIEW0); invalidate(); };

let drag = null;
const pointers=new Map();let pinchDistance=0;
function pointerGap(){const p=[...pointers.values()];return p.length===2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0;}
function freeUnproject(x,y,depth) {
  const cam=freeStageCamera(),dpr=cv.width/cv.getBoundingClientRect().width;
  return vadd(cam.pos,vadd(vmul(cam.f,depth),vadd(vmul(cam.r,(x*dpr-cv.width/2)*depth/cam.k),vmul(cam.u,-(y*dpr-cv.height/2)*depth/cam.k))));
}
stage.addEventListener('pointerdown', (e) => {
  if(e.target.closest('.inset,.reset,.free-tools'))return;
  e.preventDefault();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){drag=null;pinchDistance=pointerGap();return;}
  const rect=cv.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(cur===4){
    const onHandle=[...free.hits].some(h=>Math.hypot(x-h.x,y-h.y)<=h.r);
    if(free.tool&&!onHandle){
      const type=free.tool,max=type==='cloud'?10:16,count=free.objects.filter(o=>type==='cloud'?o.type==='cloud':o.type==='hot'||o.type==='star').length;
      if(type!=='eye'&&count>=max){freeMessageText('화면이 복잡해졌어요. 물체를 지우고 새로 놓아 보세요.');return;}
      if(type==='eye'&&free.objects.some(o=>o.type==='eye'))return;
      const cam=freeStageCamera(),depth=dot(vsub([0,0,0],cam.pos),cam.f),p=freeUnproject(x,y,depth).map((v,i)=>clamp(v,i===1?-9:-18,i===1?9:18));
      const o=freeObject(type,p);free.selected=o.id;if(type==='eye'){free.tool='';freeTools.querySelectorAll('[data-tool]').forEach(b=>b.classList.remove('active'));}freeChanged();renderFreePanel();freeMessageText(type==='eye'?'손잡이를 끌어 옮겨 보세요. 앞뒤 위치도 바꿀 수 있어요.':'빈 곳을 누르면 더 놓아요. 그만 놓으려면 아래 단추를 한 번 더 누르세요.');return;
    }
    const hit=[...free.hits].reverse().find(h=>Math.hypot(x-h.x,y-h.y)<=h.r);
    if(hit){selectFree(hit.id);free.interacting=true;const o=free.objects.find(o=>o.id===hit.id),cam=freeStageCamera(),depth=dot(vsub(o.p,cam.pos),cam.f);drag={x:e.clientX,y:e.clientY,id:o.id,depth,offset:vsub(o.p,freeUnproject(x,y,depth))};return;}
  }
  drag={x:e.clientX,y:e.clientY};
});
stage.addEventListener('pointermove', (e) => {
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){const gap=pointerGap();if(gap&&pinchDistance)view.dist=clamp(view.dist*pinchDistance/gap,cur===4?12:10,65);pinchDistance=gap;invalidate();return;}
  if (!drag) return;
  if(cur===4&&drag.id){const o=free.objects.find(o=>o.id===drag.id);if(!o)return;const r=cv.getBoundingClientRect();o.p=vadd(freeUnproject(e.clientX-r.left,e.clientY-r.top,drag.depth),drag.offset).map((v,i)=>clamp(v,i===1?-9:-18,i===1?9:18));syncFreeSelection();freeChanged(o.type!=='eye');return;}
  view.yaw -= (e.clientX - drag.x) * 0.006; view.pitch = Math.max(-1.3, Math.min(1.3, view.pitch + (e.clientY - drag.y) * 0.006));
  drag = { x: e.clientX, y: e.clientY };
  invalidate();
});
for(const event of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(event,e=>{pointers.delete(e.pointerId);drag=null;pinchDistance=0;});
document.addEventListener('pointerdown',e=>{if(cur===4&&e.target.matches('.free-controls input[type=range]'))free.interacting=true;});
function finishFreeInteraction(){if(!free.interacting)return;free.interacting=false;freeChanged(free.objects.some(o=>o.grid&&o.grid.n<17));}
document.addEventListener('pointerup',finishFreeInteraction);
document.addEventListener('pointercancel',finishFreeInteraction);
stage.addEventListener('wheel', (e) => { if(e.target.closest('.inset'))return;e.preventDefault(); view.dist = clamp(view.dist * (e.deltaY > 0 ? 1.08 : 0.93),cur===4?12:10,65);invalidate(); }, { passive: false });

function readHash(){
  const hp=location.hash.slice(1).split('&'),h=parseInt(hp[0],10);
  go(h>=1&&h<=5?h-1:0);
  if(hp.includes('e'))state.earth=true;if(hp.includes('r'))state.rays=true;if(hp.includes('n'))state.name=true;
  if(cur<4)history.replaceState(null,'','#'+(cur+1)+['e','r','n'].filter((s,i)=>[state.earth,state.rays,state.name][i]).map(s=>'&'+s).join(''));
  render();
}
window.addEventListener('hashchange',readHash);
window.addEventListener('resize',()=>{free.dirty=true;invalidate();});
new ResizeObserver(()=>{free.dirty=true;invalidate();}).observe(stage);
document.addEventListener('visibilitychange',()=>{last=performance.now();if(!document.hidden)invalidate();});
readHash();
</script>
</body>
