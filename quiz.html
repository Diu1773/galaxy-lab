<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천체 감별 함께 퀴즈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AD%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#070a1f;--panel:#11163a;--panel2:#1a2050;--line:#2c3478;--ink:#eef0ff;--muted:#a3abdf;--gold:#f4b942;--violet:#7f5af0;--teal:#2cb1bc;--coral:#e4572e;--mint:#3ddc97;--amber:#ffb454}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -10%,#1b2163 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(10px,2vw,22px)}
.muted{color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar .grow{flex:1}
.chip{border:0;border-radius:999px;padding:9px 15px;background:var(--panel2);font-weight:700;font-size:15px;min-height:44px}
.ttl{font-weight:900;font-size:clamp(17px,2vw,22px)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:#2a3170;display:block}
.dots i.done{background:var(--teal)}
.dots i.now{background:var(--gold);transform:scale(1.3)}
.q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(12px,2vw,26px);align-items:start}
.pic{margin:0;position:relative;background:#000;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;height:min(70vh,600px)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic figcaption{position:absolute;right:8px;bottom:6px;font-size:11px;color:#c9cdf0;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:8px;max-width:96%}
.pic.none{flex-direction:column;gap:10px;background:linear-gradient(160deg,#1a2050,#0b0f2b);text-align:center;padding:16px}
.bulb{font-size:clamp(60px,10vw,110px)}
.qno{color:var(--muted);font-weight:700;margin:2px 0 6px}
.qtext{font-size:clamp(21px,2.5vw,33px);font-weight:900;line-height:1.42;margin:0 0 14px;word-break:keep-all}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:0;border-radius:16px;min-height:clamp(66px,10.5vh,100px);padding:12px 52px 12px 60px;text-align:left;font-weight:900;font-size:clamp(17px,2vw,27px);line-height:1.3;display:flex;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .15s,opacity .3s,filter .3s;word-break:keep-all}
.tile .num{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px}
.t1{background:var(--violet);color:#fff}
.t2{background:var(--teal);color:#04121a}
.t3{background:var(--gold);color:#1a1300}
.t4{background:var(--coral);color:#fff}
button.tile:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile.dim{opacity:.28;filter:grayscale(.6)}
.tile.retry{opacity:.42;filter:grayscale(.8)}
.tile.retry::after{content:'🤔';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:26px}
.tile.right{outline:5px solid #fff;outline-offset:3px;animation:pop .55s ease-out;opacity:1;filter:none}
.tile.right::after{content:'✓';position:absolute;right:12px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#0b7a4b;font-size:26px;display:flex;align-items:center;justify-content:center}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.tiles.two .tile{min-height:clamp(84px,15vh,140px);justify-content:center;padding:12px;font-size:clamp(36px,4.4vw,60px)}
.panel{margin-top:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.think{display:flex;align-items:center;gap:16px}
.ring{width:clamp(72px,9vw,100px);height:clamp(72px,9vw,100px);flex:none}
.ring .rbg{fill:none;stroke:#262d6a;stroke-width:8}
.ring .rfg{fill:none;stroke:var(--teal);stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:40px 40px;transition:stroke-dashoffset .1s linear}
.ring text{fill:#fff;font-size:26px;font-weight:900;text-anchor:middle;font-family:inherit}
.say{font-size:clamp(18px,2vw,24px);font-weight:800;margin-bottom:4px;word-break:keep-all}
.exp p,.clue p{font-size:clamp(16px,1.7vw,21px);line-height:1.62;margin:8px 0 2px;word-break:keep-all}
.exp b,.clue b{color:var(--gold)}
.ans{font-size:clamp(19px,2.1vw,27px);font-weight:900;word-break:keep-all}
.exp.first .ans{color:var(--mint)}
.exp.second .ans{color:var(--teal)}
.exp.miss .ans{color:var(--amber)}
.num.sm{display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;font-size:18px;vertical-align:3px;margin:0 2px}
.phases{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.phases span{padding:6px 12px;border-radius:999px;background:#151a45;color:var(--muted);font-weight:700;font-size:clamp(13px,1.3vw,16px)}
.phases span.on{background:var(--gold);color:#1a1300}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:800;font-size:clamp(16px,1.6vw,19px);background:var(--panel2);min-height:48px}
.btn.gold{background:var(--gold);color:#1a1300}
.btn.on{background:var(--violet);color:#fff}
.btn.big{padding:13px 24px;font-size:clamp(18px,1.9vw,22px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row.center{justify-content:center}
.hero{text-align:center;padding:clamp(6px,3vh,30px) 10px 6px}
.hero .logo{font-size:clamp(44px,6vw,70px)}
.hero h1{font-size:clamp(28px,4vw,48px);margin:4px 0}
.hero p{color:var(--muted);font-size:clamp(16px,1.8vw,20px);margin:6px auto;max-width:760px;line-height:1.55;word-break:keep-all}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.mode .mi{font-size:44px;line-height:1}
.mode h2{margin:0;font-size:clamp(23px,2.6vw,30px)}
.mode p{margin:0;color:var(--muted);line-height:1.6;word-break:keep-all}
.mode p b{color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg .lbl{color:var(--muted);font-weight:700;min-width:64px}
.seg button{border:2px solid var(--line);background:#0c1030;border-radius:12px;padding:9px 14px;font-weight:800;min-height:46px}
.seg button.on{border-color:var(--gold);background:#2a2610;color:var(--gold)}
.mode .go{margin-top:auto}
.foot{text-align:center;color:var(--muted);margin-top:18px;line-height:1.7}
.link{background:none;border:0;color:var(--teal);font-weight:700;text-decoration:underline;padding:4px}
a.link{display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,30px)}
.end{text-align:center}
.end h1{font-size:clamp(24px,3.4vw,40px);margin:4px 0 6px;word-break:keep-all}
.end h2{margin:18px 0 6px}
.cele{font-size:clamp(50px,7vw,76px);line-height:1}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;text-align:left;margin:10px 0}
.rv{background:var(--panel2);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.rv img,.rv .nb{width:100%;height:150px;object-fit:cover;background:#000;display:block}
.rv .nb{display:flex;align-items:center;justify-content:center;font-size:54px;background:#0c1030}
.rv .t{padding:10px 14px;line-height:1.55;word-break:keep-all}
.rv .t b{color:var(--gold)}
.tips{background:#0c1030;border:1px dashed var(--line);border-radius:16px;padding:14px 18px;text-align:left;margin:16px 0;line-height:1.75;word-break:keep-all}
.tips h3{margin:0 0 4px;color:var(--gold)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin-top:14px}
.col{background:var(--panel2);border-radius:16px;padding:14px}
.col h3{margin:0 0 6px}
.col.ok h3{color:var(--mint)}
.col.re h3{color:var(--amber)}
.cc{display:block;padding:10px 12px;border-radius:12px;margin:6px 0;background:#0c1030;word-break:keep-all}
.cc b{display:block;font-size:18px}
.cc span{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:6px 2px}
.clue{border-color:var(--amber)}
#modal{position:fixed;inset:0;background:rgba(3,5,18,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;max-width:780px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px}
.sheet h2{margin-top:0}
.cred{padding-left:18px;line-height:1.65;font-size:15px}
.cred a{color:var(--teal)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-height:820px) and (min-aspect-ratio:1/1){.hero{padding-top:0}.hero .logo{font-size:40px}.hero h1{font-size:34px}.mode{padding:18px;gap:10px}}
@media (max-aspect-ratio:1/1),(max-width:760px){
  .q{grid-template-columns:minmax(0,1fr)}
  .pic{height:min(38vh,420px)}
  .modes,.cols{grid-template-columns:1fr}
}
@media (max-width:480px){
  .tile{padding-left:54px;padding-right:46px}
  .tile .num{width:32px;height:32px;font-size:18px;left:10px}
  .tiles{gap:9px}
}
</style>
</head>

function josa(word) {
  const c = word.charCodeAt(word.length - 1);
  if (c >= 0xac00 && c <= 0xd7a3) return (c - 0xac00) % 28 ? '이에요' : '예요';
  return '예요';
}

let audio = null;
function chime(notes) {
  if (!S.sound || DEMO) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime + 0.02;
    notes.forEach((f, k) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + k * 0.13;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + 0.75);
    });
  } catch (e) {}
}

  } else if (p === 'signal') {
    panel.innerHTML = `<div class="box">
      <div class="say">✋ 가슴 앞에서 손가락으로 답을 보여 주세요</div>
      <div class="muted">${q.opts.length === 2 ? 'O는 손가락 1개, X는 손가락 2개예요.' : '고른 번호만큼 손가락을 펴요.'} 친구 답은 보지 않기!</div>
      <div class="row"><button class="btn gold big" data-act="reveal">정답 공개 ▶</button></div></div>`;
  } else {
    app.querySelectorAll('.tile').forEach((t) => t.classList.add(+t.dataset.k === q.a ? 'right' : 'dim'));
    const m = S.marked.has(S.set[S.i]);
    panel.innerHTML = `<div class="box exp">
      <div class="ans">정답 <span class="num sm t${q.a + 1}">${q.a + 1}</span> ${q.opts[q.a]}</div>
      <p>${q.ex}</p>
      <div class="row"><button class="btn${m ? ' on' : ''}" data-act="mark">${m ? '🔖 다시 볼 문제 ✓' : '🔖 다시 볼 문제로 표시'}</button>
      <button class="btn gold big" data-act="next">${S.i + 1 < S.set.length ? '다음 문제 ▶' : '마무리 ▶'}</button></div></div>`;
    chime([523, 659, 784]);
  }
}
function reviewCard(id) {
  const q = QUESTIONS[id];
  return `<div class="rv">${q.img ? `<img src="${q.img}" alt="${q.alt}">` : '<div class="nb">💡</div>'}
    <div class="t">${q.q}<br><b>정답: ${q.opts[q.a]}</b><br>${q.ex}</div></div>`;
}
function tips() {
  return `<div class="tips"><h3>🔍 감별 비법</h3>
    ① 별이 하나하나 보이면 <b>성단</b> → 엉성하면 <b>산개 성단</b>, 공처럼 빽빽하면 <b>구상 성단</b><br>
    ② 구름처럼 퍼져 보이면 <b>성운</b> → 스스로 빛나면 <b>방출</b>, 별빛을 되비추면 <b>반사</b>, 빛을 가리면 <b>암흑</b><br>
    ③ 우리은하 밖에 있는 거대한 별의 집단이면 <b>외부 은하</b></div>`;
}
function tEnd() {
  stopAll();
  const ids = S.set.filter((id) => S.marked.has(id));
  app.innerHTML = topbar(true) + `<div class="card end">
    <div class="cele">🎉</div>
    <h1>우리 반이 함께 ${S.set.length}문제를 풀었어요!</h1>
    <p class="muted">헷갈린 문제는 함께 다시 보면 돼요. 모두 수고했어요!</p>
    ${ids.length ? `<h2>🔖 다시 볼 문제</h2><div class="review">${ids.map(reviewCard).join('')}</div>` : '<p class="say" style="margin-top:14px">다시 볼 문제로 표시한 문제가 없어요. 👏</p>'}
    ${tips()}
    <div class="row center">${ids.length ? '<button class="btn gold big" data-act="redo">🔖 다시 볼 문제만 함께 풀기</button>' : ''}<button class="btn big" data-act="home">⌂ 처음 화면</button></div>
  </div>`;
  confetti();
}

function sStart(list) {
  S.mode = 's'; S.set = list; S.i = 0; S.rec = [];
  sQuestion();
}
function sQuestion() {
  const q = cur();
  S.tries = 0; S.done = false;
  app.innerHTML = topbar() + `<div class="q">${picture(q)}<div class="side">
      <div class="qno">문제 ${S.i + 1} / ${S.set.length}</div>
      <div class="qtext">${q.q}</div>
      ${tiles(q, true)}
      <div class="panel" id="panel"><div class="row" style="margin-top:0"><button class="btn" data-act="hint">💡 힌트 보기</button><span class="muted">힌트를 봐도 괜찮아요</span></div></div>
    </div></div>`;
}
function showHint() {
  if (S.done) return;
  document.getElementById('panel').innerHTML = `<div class="box clue"><div class="say">💡 힌트</div><p>${cur().hint}</p></div>`;
}
function sPick(k, el) {
  if (S.done || el.disabled) return;
  const q = cur(), panel = document.getElementById('panel');
  if (k === q.a) { el.classList.add('right'); sFinish(S.tries === 0 ? 'first' : 'second'); return; }
  S.tries++;
  el.classList.add('retry'); el.disabled = true;
  if (S.tries === 1 && q.opts.length > 2) {
    panel.innerHTML = `<div class="box clue"><div class="say">🤔 다시 생각해 볼까요?</div><p>단서: ${q.hint}</p></div>`;
  } else {
    app.querySelectorAll('.tile').forEach((t) => { if (+t.dataset.k === q.a) t.classList.add('right'); });
    sFinish('miss');
  }
}
function sFinish(kind) {
  S.done = true;
  const q = cur();
  S.rec.push({ id: S.set[S.i], kind });
  app.querySelectorAll('.tile').forEach((t) => {
    t.disabled = true;
    if (!t.classList.contains('right') && !t.classList.contains('retry')) t.classList.add('dim');
  });
  const head = kind === 'first' ? '정답! ✨' : kind === 'second' ? '두 번째에 찾았어요! 👍'
    : `정답은 ${q.a + 1}번 ‘${q.opts[q.a]}’${josa(q.opts[q.a])}`;
  document.getElementById('panel').innerHTML = `<div class="box exp ${kind}">
    <div class="ans">${head}</div>
    <p>${q.ex}</p>
    ${kind === 'miss' ? '<p class="muted">해설을 읽고 다음 문제에서 써먹어 봐요!</p>' : ''}
    <div class="row"><button class="btn gold big" data-act="next">${S.i + 1 < S.set.length ? '다음 문제 ▶' : '끝까지 풀었어요 ▶'}</button></div></div>`;
}
function sEnd() {
  const seen = {}, ok = {};
  S.rec.forEach((r) => QUESTIONS[r.id].tags.forEach((t) => {
    seen[t] = true;
    if (!(t in ok)) ok[t] = true;
    if (r.kind !== 'first') ok[t] = false;
  }));
  const chip = (c) => `<div class="cc"><b>${c.name}</b><span>${c.key}</span></div>`;
  const learned = CONCEPTS.filter((c) => seen[c.name] && ok[c.name]);
  const review = CONCEPTS.filter((c) => seen[c.name] && !ok[c.name]);
  S.again = S.rec.filter((r) => r.kind !== 'first').map((r) => r.id);
  app.innerHTML = topbar(true) + `<div class="card end">
    <div class="cele">🎉</div>
    <h1>끝까지 풀었어요!</h1>
    <p class="muted">${S.rec.length}문제를 풀었어요. 이 결과는 내 화면에서만 보여요.</p>
    <div class="cols">
      <div class="col ok"><h3>✓ 알게 된 것</h3>${learned.map(chip).join('') || '<div class="empty">다시 풀면 여기로 옮겨 올 거예요!</div>'}</div>
      <div class="col re"><h3>🔁 다시 보면 좋을 것</h3>${review.map(chip).join('') || '<div class="empty">헷갈린 개념이 없어요. 👏</div>'}
        ${review.length ? '<div class="empty">두 번째에 맞힌 개념도 여기에 있어요. 한 번 더 보면 확실해져요!</div>' : ''}</div>
    </div>
    ${tips()}
    <div class="row center">${S.again.length ? `<button class="btn gold big" data-act="again">🔁 헷갈린 문제만 다시 풀기 (${S.again.length}문제)</button>` : ''}
      <button class="btn big" data-act="restart">처음부터 다시</button><button class="btn big" data-act="home">⌂ 처음 화면</button></div>
  </div>`;
}

function openCredits() {
  modal.innerHTML = `<div class="sheet"><h2>📷 사진 출처</h2>
    <ul class="cred">${CREDITS.map((c) => `<li><b>${c.title}</b> — ${c.author} · ${c.licUrl ? `<a href="${c.licUrl}" target="_blank" rel="noopener">${c.lic}</a>` : c.lic}${c.note ? ' · ' + c.note : ''} · <a href="${c.src}" target="_blank" rel="noopener">원본 파일</a></li>`).join('')}
    <li><b>성단 모식도 A·B</b> — 직접 그린 그림</li></ul>
    <p class="muted">사진은 모두 Wikimedia Commons에 공개된 파일이에요.</p>
    <div class="row center"><button class="btn gold" data-close="1">닫기</button></div></div>`;
  modal.classList.add('open');
}
modal.addEventListener('click', (e) => {
  if (e.target === modal || e.target.closest('[data-close]')) modal.classList.remove('open');
});

function confetti() {
  if (DEMO) return;
  const c = document.createElement('canvas');
  c.className = 'confetti'; document.body.appendChild(c);
  const x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#f4b942', '#7f5af0', '#2cb1bc', '#e4572e', '#eef0ff'];
  const P = [];
  for (let k = 0; k < 160; k++) {
    P.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 2.2, vy: 2 + Math.random() * 3.2,
      r: 4 + Math.random() * 5, a: Math.random() * 6.3, va: (Math.random() - 0.5) * 0.3, c: cols[k % cols.length] });
  }
  const t0 = performance.now();
  (function frame(t) {
    x.clearRect(0, 0, W, H);
    P.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore();
    });
    if (t - t0 < 4200) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

const ACT = {
  seg: (b) => { S.pick[b.dataset.k] = +b.dataset.v; b.parentNode.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); },
  tstart: () => tStart(SETS[S.pick.tn].slice()),
  sstart: () => sStart(SETS[S.pick.sn].slice()),
  home: () => home(),
  cred: () => openCredits(),
  snd: (b) => { S.sound = !S.sound; b.textContent = S.sound ? '🔈 소리 켬' : '🔇 소리 끔'; },
  pause: (b) => { S.paused = !S.paused; b.textContent = S.paused ? '▶ 계속' : '⏸ 잠깐 멈춤'; },
  skip: () => tPhase('signal'),
  reveal: () => tPhase('reveal'),
  mark: (b) => {
    const id = S.set[S.i];
    if (S.marked.has(id)) S.marked.delete(id); else S.marked.add(id);
    const m = S.marked.has(id);
    b.classList.toggle('on', m); b.textContent = m ? '🔖 다시 볼 문제 ✓' : '🔖 다시 볼 문제로 표시';
  },
  next: () => {
    S.i++;
    if (S.i < S.set.length) { if (S.mode === 't') tQuestion(); else sQuestion(); }
    else if (S.mode === 't') tEnd(); else sEnd();
  },
  redo: () => tStart(S.set.filter((id) => S.marked.has(id))),
  hint: () => showHint(),
  again: () => sStart(S.again.slice()),
  restart: () => sStart(SETS[S.pick.sn].slice())
};
app.addEventListener('click', (e) => {
  const t = e.target.closest('button.tile');
  if (t && S.mode === 's') { sPick(+t.dataset.k, t); return; }
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b);
});
document.addEventListener('keydown', (e) => {
  if (modal.classList.contains('open')) { if (e.key === 'Escape') modal.classList.remove('open'); return; }
  if (S.mode !== 't' || !document.getElementById('panel')) return;
  const onButton = e.target && e.target.tagName === 'BUTTON';
  if (e.key === 'ArrowRight' || (!onButton && (e.key === ' ' || e.key === 'Enter'))) {
    e.preventDefault();
    if (S.phase === 'think') tPhase('signal');
    else if (S.phase === 'signal') tPhase('reveal');
    else ACT.next();
  } else if (e.key === 'p' || e.key === 'P') {
    const b = document.getElementById('pauseBtn');
    if (b) ACT.pause(b);
  }
});

function demo(d) {
  if (d === 't-think') { tStart(SETS[5].slice()); S.paused = true; S.left = 9; ring(); }
  else if (d === 't-signal') { tStart(SETS[5].slice()); S.i = 1; tQuestion(); tPhase('signal'); }
  else if (d === 't-reveal') { tStart(SETS[5].slice()); S.i = 3; S.marked.add(S.set[3]); tQuestion(); tPhase('reveal'); }
  else if (d === 't-end') { tStart(SETS[5].slice()); S.marked.add(S.set[1]); S.marked.add(S.set[3]); S.i = S.set.length; tEnd(); }
  else if (d === 's-hint') { sStart(SETS[8].slice()); S.i = 1; sQuestion(); showHint(); }
  else if (d === 's-retry') { sStart(SETS[8].slice()); S.i = 4; sQuestion(); sPick(0, app.querySelector('.tile[data-k="0"]')); }
  else if (d === 's-right') { sStart(SETS[8].slice()); S.i = 6; sQuestion(); sPick(cur().a, app.querySelector('.tile[data-k="' + cur().a + '"]')); }
  else if (d === 's-end') {
    sStart(SETS[8].slice());
    S.rec = [{ id: 0, kind: 'first' }, { id: 1, kind: 'first' }, { id: 2, kind: 'second' }, { id: 3, kind: 'first' },
      { id: 4, kind: 'miss' }, { id: 5, kind: 'first' }, { id: 6, kind: 'first' }, { id: 7, kind: 'first' }];
    S.i = S.set.length; sEnd();
  } else home();
}
if (DEMO) demo(DEMO); else home();
</script>
