<body>
<div class="shell">
  <header>
    <div class="progress-area"><div class="progress-label"><strong id="stepLabel"></strong><span id="stepName"></span></div><div class="progress" role="progressbar" aria-label="탐구 진행" aria-valuemin="0" aria-valuemax="5"><span id="progressFill"></span></div></div>
    <span class="connection" id="connection" role="status"></span><button class="quiet fullscreen" id="fullscreen" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4V9M15 4H20V9M20 15V20H15M9 20H4V15"/></svg> 전체 화면</button>
  <a class="sitehome" href="./">⌂ 첫 화면</a>
</header>
  <main id="main"></main>
  <div id="worksheet" class="worksheet" hidden></div>
  <section id="waiting" class="waiting panel" role="status" hidden>다 했어요! 선생님이 다음 단계를 열 때까지 활동지를 확인해요.</section>

  <nav class="nav" id="navigation" aria-label="단계 이동"><button class="quiet" id="previous"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6L5 12L11 18"/></svg> 이전</button><button class="forward" id="next" disabled>다음 <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12H19M13 6L19 12L13 18"/></svg></button></nav>
</div>
<dialog id="creditsDialog" aria-labelledby="creditsTitle"><h2 id="creditsTitle">사진 출처</h2><div id="creditsList"></div><button class="close-dialog" id="closeCredits">닫기</button></dialog>
<script>
const SERVER = 'https://hubble-class.onrender.com';
const ROOM = new URLSearchParams(location.search).get('room') || '31';
const params = new URLSearchParams(location.search);
const API = params.get('server') || SERVER;
const teacherMode = params.get('teacher') === '1';
function demoAllowed(){try{return localStorage.getItem('hubble-demo')==='1';}catch{return false;}}
const board = !teacherMode && params.get('board') === '1' && demoAllowed();
const demo = !teacherMode && !board && params.get('demo') === '1' && demoAllowed();
const GALAXIES = [
  {id:'m87', name:'M87 (처녀자리 은하단)', distance:0.5, speed:1300, shape:'타원'},
  {id:'ngc4696', name:'NGC 4696 (센타우루스자리 은하단)', distance:1.2, speed:3000, shape:'타원'},
  {id:'ngc1275', name:'NGC 1275 (페르세우스자리 은하단)', distance:2.3, speed:5300, shape:'타원'},
  {id:'ngc4889', name:'NGC 4889 (머리털자리 은하단)', distance:3.1, speed:6500, shape:'타원'},
  {id:'ngc6041', name:'NGC 6041 (헤르쿨레스자리 은하단)', distance:4.7, speed:10500, shape:'타원'},
  {id:'m31', name:'안드로메다은하', distance:0.025, speed:-300, shape:'나선'}
];
const CREDITS = ['배경 사진(용골자리 성운): NASA, ESA, CSA, STScI (퍼블릭 도메인)',
  'M87: NASA, STScI, WikiSky (퍼블릭 도메인)',
  'NGC 4696: NASA, ESA/Hubble, A. Fabian (CC BY 4.0)',
  'NGC 1275: NASA, ESA, Hubble Heritage (STScI/AURA)-ESA/Hubble Collaboration (퍼블릭 도메인)',
  'NGC 4889: NASA Hubble (CC BY 2.0)',
  'NGC 6041: Sloan Digital Sky Survey (CC BY 4.0)',
  '안드로메다은하: Adam Evans (CC BY 2.0)',
  '은하 자료: 위키백과 각 은하 문서 값을 반올림'
];

'use strict';
const $ = (s) => document.querySelector(s);
const main = $('#main');
const sample = GALAXIES.filter(g => g.id !== 'm31');

function galaxyDiagram(g){
  const variants={m87:[-12,28],ngc4696:[20,21],ngc1275:[-25,25],ngc4889:[12,18],ngc6041:[-18,23]};

}

async function api(path,body,timeout=2500){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const response=await fetch(API.replace(/\/$/,'')+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
    if(!response.ok){const error=new Error('서버 응답을 확인해 주세요.');error.status=response.status;throw error;}
    return await response.json();
  }finally{clearTimeout(timer);}
}
async function wakeServer(limit){
  const deadline=Date.now()+limit;
  while(Date.now()<deadline){
    try{const reply=await api('/health',undefined,Math.min(5000,deadline-Date.now()));if(reply.ok===true)return;}catch{}
    const remaining=deadline-Date.now();if(remaining>0)await new Promise(resolve=>setTimeout(resolve,Math.min(500,remaining)));
  }
  throw new Error('서버에 연결하지 못했어요.');
}
function validServerState(data){return Number.isInteger(data.step)&&data.step>=0&&data.step<=5&&Number.isFinite(data.updatedAt);}
function applyServerState(data){
  if(!validServerState(data))throw new Error('단계를 확인할 수 없어요.');
  serverStep=data.step;
  if(board){
    if(boardStep!==data.step){boardStep=data.step;step=data.step+1;completePreviousSteps();render();window.scrollTo(0,0);}
  }else if(!demo&&step>allowedStep()){step=allowedStep();render();}else syncNavigation();
}

function syncNavigation(){

  $('#next').classList.toggle('next',canAdvance());

  $('#keyForm').hidden = !(waiting&&mode==='key');

  $('#worksheet').innerHTML = `<span>${bands[step]||''}</span>`;

$('#next').addEventListener('click',()=>{if(canAdvance())moveTo(step+1);});
$('#previous').addEventListener('click',()=>moveTo(step-1));
document.addEventListener('keydown',e=>{if(teacherMode||board||e.target?.closest('input,textarea')||$('#creditsDialog').open||e.altKey||e.ctrlKey||e.metaKey||busy)return;if(e.key==='ArrowRight'){e.preventDefault();if(canAdvance())moveTo(step+1);}else if(e.key==='ArrowLeft'){e.preventDefault();moveTo(step-1);}});
$('#closeCredits').addEventListener('click',()=>$('#creditsDialog').close());
if(document.fullscreenEnabled&&document.documentElement.requestFullscreen){$('#fullscreen').hidden=false;$('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('#fullscreen').hidden=true;}});document.addEventListener('fullscreenchange',()=>{$('#fullscreen').innerHTML=document.fullscreenElement?'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4V9M15 4H20V9M20 15V20H15M9 20H4V15"/></svg> 전체 화면 닫기':'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4V9M15 4H20V9M20 15V20H15M9 20H4V15"/></svg> 전체 화면';});}
new ResizeObserver(()=>{if(step===2||step===3)drawGraph();else if(step===4)drawModel();else if(step===5)drawCenter();}).observe(main);
function applyRequestedStep(){
  const requested=Number(params.get('step'));
  if(!Number.isInteger(requested)||requested<1||requested>5)return;
  step=Math.min(requested,allowedStep());
  completePreviousSteps();
}
function completePreviousSteps(){
  if(step>1)state.skippedGuess=true;
  if(step>2)sample.forEach(g=>state.seen.add(g.id));
  if(step>3){state.rule1=true;state.rule2=true;}
  if(step>4){state.grown=true;state.growth=1.5;state.predictions=['3','6'];state.modelAnswer=true;}
  if(step>5){state.visits=new Set([0,1,5]);state.centerAnswer=true;}
}
$('#keyForm').addEventListener('submit',e=>{
  e.preventDefault();if(mode!=='key'||!complete()||busy||step<1||step>5)return;
  if(wordHash($('#keyWord').value)!==keyHashes[step]){$('#keyFeedback').textContent='선생님이 알려 준 낱말을 다시 넣어 볼까요?';return;}
  keyStep=Math.max(keyStep,step+1);moveTo(step+1);
});
resetState();
if(teacherMode)initTeacher();else if(board)connectBoard();else connectStudent();
</script>
</body>
</html>
