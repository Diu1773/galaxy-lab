<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리은하 탐험기</title>
<style>
:root{--bg:#070a1f;--panel:#11163a;--panel2:#1a2050;--ink:#eef0ff;--muted:#a3abdf;--gold:#f4b942;--violet:#8e6bff;--teal:#2cb1bc;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button,.btn{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--panel2);cursor:pointer}
.tabs button.on{background:var(--violet)}
.btn.gold{background:var(--gold);color:#1a1300}
.btn.teal{background:var(--teal);color:#021d20}
main{display:grid;grid-template-columns:1fr 330px;gap:12px;padding:0 16px 16px;height:calc(100% - 62px)}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}.stage{height:62vh}}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:380px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
aside{background:var(--panel);border-radius:14px;padding:16px;overflow:auto;line-height:1.6;font-size:15px}
aside h2{font-size:17px;margin:0 0 8px;color:var(--gold)}
aside .think{margin-top:12px;background:var(--panel2);border-radius:10px;padding:10px 12px}
aside .think b{color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
input[type=range]{width:100%}
.meter{height:16px;border-radius:8px;background:#0b0f2b;overflow:hidden;margin-top:6px}
.meter>div{height:100%;background:linear-gradient(90deg,#2cb1bc,#f4b942)}
.big{font-size:22px;font-weight:800;color:var(--gold)}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.sitehome{margin-left:auto;color:#eef0ff;text-decoration:none;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;background:#1a2050;white-space:nowrap}
@media (min-width:901px){body{display:flex;flex-direction:column}main{flex:1;min-height:0;height:auto}}
</style>
</head>
<body>
<header>
  <h1>🌌 우리은하 탐험기</h1>
  <div class="tabs" id="tabs">
    <button data-v="top" class="on">① 위에서 보기</button>
    <button data-v="side">② 옆에서 보기</button>
    <button data-v="sky">③ 태양계에서 본 은하수</button>
    <button data-v="game">④ 태양계 찾기 게임</button>
  </div>
<a class="sitehome" href="./">⌂ 첫 화면</a>
</header>
<main>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <aside id="panel"></aside>
</main>
<script>
"use strict";
const PC = { R: 15000, SUN_R: 8500 };
const SUN = { x: 0, y: -PC.SUN_R, z: 15 };
const PITCH = 13 * Math.PI / 180, KARM = 1 / Math.tan(PITCH), R0 = 3600;
const BAR = 57 * Math.PI / 180, BAR_HALF = 4200;
const ARMS = [
  { t0: BAR, w: 0.32 }, { t0: BAR + Math.PI, w: 0.32 },
  { t0: BAR + Math.PI / 2, w: 0.18 }, { t0: BAR + 1.5 * Math.PI, w: 0.18 }
];
const COMP = { BULGE: 0, BAR: 1, ARM: 2, DISK: 3, HALO: 4 };

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeGalaxy(counts, seed) {
  const R = rng(seed);
  const g = () => { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); };
  const n = counts.bulge + counts.bar + counts.arm + counts.disk + counts.halo;
  const X = new Float32Array(n), Y = new Float32Array(n), Z = new Float32Array(n), C = new Uint8Array(n);
  let i = 0;
  const put = (x, y, z, c) => { X[i] = x; Y[i] = y; Z[i] = z; C[i] = c; i++; };
  for (let k = 0; k < counts.bulge;) {
    const x = g() * 1100, y = g() * 1100, z = g() * 760;
    if (x * x + y * y + z * z < 4000 * 4000) { put(x, y, z, COMP.BULGE); k++; }
  }
  for (let k = 0; k < counts.bar;) {
    const t = g() * 2000; if (Math.abs(t) > BAR_HALF) continue;
    const s = g() * 450, z = g() * 380;
    put(t * Math.cos(BAR) - s * Math.sin(BAR), t * Math.sin(BAR) + s * Math.cos(BAR), z, COMP.BAR); k++;
  }
  const armPick = () => { let u = R(), acc = 0; for (const a of ARMS) { acc += a.w; if (u < acc) return a; } return ARMS[0]; };
  for (let k = 0; k < counts.arm;) {
    const r = 2600 - 3300 * Math.log(1 - R()); if (r > PC.R + 500) continue;
    const a = armPick();
    const th = a.t0 + KARM * Math.log(r / R0) + g() * 0.15;
    const z = g() * 150;
    put(r * Math.cos(th), r * Math.sin(th), z, COMP.ARM); k++;
  }
  for (let k = 0; k < counts.disk;) {
    const r = 2400 - 3600 * Math.log(1 - R()); if (r > PC.R + 800) continue;
    const th = R() * Math.PI * 2;
    const z = (R() < 0.12 ? g() * 650 : g() * 230);
    put(r * Math.cos(th), r * Math.sin(th), z, COMP.DISK); k++;
  }
  for (let k = 0; k < counts.halo;) {
    const r = 2500 - 6500 * Math.log(1 - R()); if (r > 24000) continue;
    const u = R() * 2 - 1, ph = R() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    put(r * s * Math.cos(ph), r * s * Math.sin(ph), r * u, COMP.HALO); k++;
  }
  return { X, Y, Z, C, n };
}

const COLORS = [
  [1.0, 0.80, 0.52], [1.0, 0.84, 0.58], [0.62, 0.74, 1.0], [0.95, 0.90, 0.82], [0.95, 0.80, 0.55]
];
const WEIGHT = [1.0, 1.0, 0.85, 0.55, 0.0];

function boxBlur(a, w, h, r) {
  const t = new Float32Array(a.length);
  for (let y = 0; y < h; y++) {
    let acc = 0; const row = y * w;
    for (let x = -r; x <= r; x++) acc += a[row + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) {
      t[row + x] = acc / (2 * r + 1);
      acc += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let y = -r; y <= r; y++) acc += t[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) {
      a[y * w + x] = acc / (2 * r + 1);
      acc += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x];
    }
  }
}

function renderProjection(gal, W, H, scale, proj, gain) {
  const R = new Float32Array(W * H), G = new Float32Array(W * H), B = new Float32Array(W * H);
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < gal.n; i++) {
    const c = gal.C[i]; const w = WEIGHT[c]; if (!w) continue;
    const p = proj(gal.X[i], gal.Y[i], gal.Z[i]);
    const fx = cx + p[0] * scale, fy = cy - p[1] * scale;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    if (x0 < 0 || y0 < 0 || x0 >= W - 1 || y0 >= H - 1) continue;
    const ax = fx - x0, ay = fy - y0, col = COLORS[c];
    const ws = [(1 - ax) * (1 - ay), ax * (1 - ay), (1 - ax) * ay, ax * ay];
    const idx = [y0 * W + x0, y0 * W + x0 + 1, (y0 + 1) * W + x0, (y0 + 1) * W + x0 + 1];
    for (let k = 0; k < 4; k++) { const q = ws[k] * w; R[idx[k]] += q * col[0]; G[idx[k]] += q * col[1]; B[idx[k]] += q * col[2]; }
  }
  const gR = R.slice(), gG = G.slice(), gB = B.slice();
  const rad = Math.max(2, Math.round(W / 160));
  boxBlur(gR, W, H, rad); boxBlur(gG, W, H, rad); boxBlur(gB, W, H, rad);
  const img = new ImageData(W, H);
  for (let p = 0; p < W * H; p++) {
    const r = R[p] + gR[p] * 2.2, g = G[p] + gG[p] * 2.2, b = B[p] + gB[p] * 2.2;
    img.data[p * 4] = 255 * (1 - Math.exp(-r * gain));
    img.data[p * 4 + 1] = 255 * (1 - Math.exp(-g * gain));
    img.data[p * 4 + 2] = 255 * (1 - Math.exp(-b * gain * 1.05));
    img.data[p * 4 + 3] = 255;
  }
  return img;
}

const GW = 720, GH = 200, BMAX = 50, LOCAL = 0.16;
function buildSky() {
  const gal = makeGalaxy({ bulge: 34000, bar: 22000, arm: 70000, disk: 52000, halo: 1500 }, 7);
  const I = new Float32Array(GW * GH), Wm = new Float32Array(GW * GH);
  for (let i = 0; i < gal.n; i++) {
    const dx = gal.X[i] - SUN.x, dy = gal.Y[i] - SUN.y, dz = gal.Z[i] - SUN.z;
    const d2 = (dx * dx + dy * dy + dz * dz) / 1e6;
    if (d2 < 1.0) continue;
    const lum = 1 / d2;
    const l = Math.atan2(dx, dy) * 180 / Math.PI;
    const b = Math.atan2(dz, Math.hypot(dx, dy)) * 180 / Math.PI;
    if (Math.abs(b) >= BMAX) continue;
    const gx = Math.min(GW - 1, Math.floor((l + 180) / 360 * GW));
    const gy = Math.min(GH - 1, Math.floor((BMAX - b) / (2 * BMAX) * GH));
    const p = gy * GW + gx;
    I[p] += lum;
    if (gal.C[i] <= COMP.BAR || gal.C[i] === COMP.HALO) Wm[p] += lum;
  }
  for (let gy = 0; gy < GH; gy++) {
    const b = BMAX - (gy + 0.5) / GH * 2 * BMAX;
    for (let gx = 0; gx < GW; gx++) {
      const l = (gx + 0.5) / GW * 360 - 180;
      const dust = 1 - 0.62 * Math.exp(-((b / 1.5) ** 2)) * Math.exp(-((l / 75) ** 2));
      I[gy * GW + gx] *= dust; Wm[gy * GW + gx] *= dust;
    }
  }
  boxBlur(I, GW, GH, 2); boxBlur(I, GW, GH, 2); boxBlur(Wm, GW, GH, 2); boxBlur(Wm, GW, GH, 2);

  let peak = 0;
  for (let gx = GW / 2 - 20; gx < GW / 2 + 20; gx++) peak = Math.max(peak, I[(GH / 2) * GW + gx]);
  for (let gy = 0; gy < GH; gy++) {
    const b = BMAX - (gy + 0.5) / GH * 2 * BMAX;
    for (let gx = 0; gx < GW; gx++) {
      const l = (gx + 0.5) / GW * 360 - 180;
      const dust = 1 - 0.45 * Math.exp(-((b / 1.5) ** 2)) * Math.exp(-((l / 75) ** 2));
      I[gy * GW + gx] += LOCAL * peak * Math.exp(-((b / 5.5) ** 2)) * (0.8 + 0.2 * Math.cos(l * Math.PI / 180)) * dust;
    }
  }
  const sorted = Array.from(I).sort((a, b) => a - b);
  const ref = sorted[Math.floor(sorted.length * 0.995)];
  const gain = 2.6 / ref;
  const off = document.createElement('canvas'); off.width = GW; off.height = GH;
  const ctx = off.getContext('2d'); const img = ctx.createImageData(GW, GH);
  for (let p = 0; p < GW * GH; p++) {
    const v = 1 - Math.exp(-I[p] * gain);
    const warm = I[p] > 0 ? Math.min(1, Wm[p] / I[p] * 1.6) : 0;
    const r = 0.72 + 0.28 * warm, gcol = 0.80 + 0.06 * warm, bcol = 1.0 - 0.35 * warm;
    img.data[p * 4] = 255 * v * r; img.data[p * 4 + 1] = 255 * v * gcol; img.data[p * 4 + 2] = 255 * v * bcol; img.data[p * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const R = rng(99), stars = [];
  for (let k = 0; k < 1700; k++) {
    const u = R() * 2 - 1, ph = R() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const d = 20 + 380 * Math.cbrt(R());
    const x = d * s * Math.cos(ph), y = d * s * Math.sin(ph), z = d * u * 0.7;
    const l = Math.atan2(x, y) * 180 / Math.PI, b = Math.atan2(z, Math.hypot(x, y)) * 180 / Math.PI;
    if (Math.abs(b) >= BMAX) continue;
    const mag = Math.min(1, 900 / (d * d) + 0.12 * R());
    stars.push({ l, b, mag, warm: R() < 0.3 });
  }
  function windowSum(lc, half, bh) {
    let s = 0;
    for (let gy = 0; gy < GH; gy++) {
      const b = BMAX - (gy + 0.5) / GH * 2 * BMAX; if (Math.abs(b) > bh) continue;
      for (let gx = 0; gx < GW; gx++) {
        const l = (gx + 0.5) / GW * 360 - 180;
        let d = Math.abs(l - lc); if (d > 180) d = 360 - d;
        if (d <= half) s += I[gy * GW + gx];
      }
    }
    return s;
  }
  const ref0 = windowSum(0, 45, 30);
  return { canvas: off, stars, brightness: (lc) => Math.round(100 * windowSum(lc, 45, 30) / ref0) };
}

const cv = document.getElementById('cv'), stage = document.getElementById('stage'), panel = document.getElementById('panel');
const ctx = cv.getContext('2d');
const state = { view: 'top', labels: true, scale: true, dir: 0, guess: null, tries: 0, best: null, reveal: false, hist: [] };
let galView = null;
let cache = {}, sky = null, mini = null;

const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
function txt(s, x, y, size, color, align) {
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 4); ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function arrow(x1, y1, x2, y2, color, both) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const head = (xa, ya, xb, yb) => {
    const a = Math.atan2(yb - ya, xb - xa), h = 11;
    ctx.beginPath(); ctx.moveTo(xb, yb);
    ctx.lineTo(xb - h * Math.cos(a - 0.4), yb - h * Math.sin(a - 0.4));
    ctx.lineTo(xb - h * Math.cos(a + 0.4), yb - h * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill();
  };
  head(x1, y1, x2, y2); if (both) head(x2, y2, x1, y1);
}
function sunMarker(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#ffd34d'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,211,77,.8)'; ctx.stroke();
}

function sizeCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = stage.clientWidth, h = stage.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w, h, dpr };
}

function getRender(kind, W, H, scale) {
  const key = kind + W + 'x' + H;
  if (cache[key]) return cache[key];
  const proj = kind === 'top' ? (x, y, z) => [x, y] : (x, y, z) => [y, z];
  const gain = kind === 'top' ? 0.55 : 0.40;
  const img = renderProjection(galView, W, H, scale, proj, gain);
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  off.getContext('2d').putImageData(img, 0, 0);
  cache = {}; cache[key] = off; return off;
}

function drawTop(w, h, dpr) {
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  const scaleDev = 0.46 * Math.min(W, H) / 16500;
  ctx.drawImage(getRender('top', W, H, scaleDev), 0, 0, w, h);
  const s = scaleDev / dpr, cx = w / 2, cy = h / 2;
  const X = (x) => cx + x * s, Y = (y) => cy - y * s;
  const fs = Math.max(13, Math.min(18, w / 50));
  if (state.scale) {
    const yb = Y(-15600);
    arrow(X(-15000), yb, X(15000), yb, '#9fd8ff', true);
    txt('지름 약 30000 pc', cx, yb + fs * 1.2, fs, '#9fd8ff');
    ctx.setLineDash([6, 6]); arrow(X(0), Y(0), X(SUN.x), Y(SUN.y) - 10, '#ffd34d'); ctx.setLineDash([]);
    txt('약 8500 pc', X(0) + fs * 3.4, Y(SUN.y / 2), fs, '#ffd34d');
  }
  sunMarker(X(SUN.x), Y(SUN.y), Math.max(5, w / 140));
  if (state.labels) {
    txt('태양계', X(SUN.x), Y(SUN.y) + fs * 2.0, fs + 1, '#ffd34d');
    txt('중심부 (막대 모양)', cx, cy - 4600 * s, fs, '#ffe1a8');
    const r = 11500, th = ARMS[0].t0 + KARM * Math.log(r / R0);
    txt('나선팔', X(r * Math.cos(th)), Y(r * Math.sin(th)), fs, '#bcd0ff');
    txt('위에서 본 우리은하 = 막대 나선 모양', cx, fs * 1.4, fs + 2, '#ffffff');
  }
}

function drawSide(w, h, dpr) {
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  const scaleDev = 0.46 * W / 16500;
  ctx.drawImage(getRender('side', W, H, scaleDev), 0, 0, w, h);
  const s = scaleDev / dpr, cx = w / 2, cy = h / 2;
  const X = (y) => cx + y * s, Y = (z) => cy - z * s;
  const fs = Math.max(13, Math.min(18, w / 50));
  ctx.fillStyle = 'rgba(255,220,150,.85)';
  for (let i = 0; i < galView.n; i++) {
    if (galView.C[i] !== COMP.HALO || i % 2) continue;
    const x = X(galView.Y[i]), y = Y(galView.Z[i]);
    if (x < 0 || y < 0 || x > w || y > h) continue;
    ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(255,220,150,.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, cy, 19000 * s, 19000 * s, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  sunMarker(X(SUN.y), Y(SUN.z), Math.max(5, w / 140));
  if (state.scale) {
    const yb = cy + 3200 * s + fs * 2.2;
    arrow(X(-15000), yb, X(15000), yb, '#9fd8ff', true);
    txt('지름 약 30000 pc', cx, yb + fs * 1.2, fs, '#9fd8ff');
    const xt = X(2600);
    arrow(xt, Y(2000), xt, Y(-2000), '#ffe1a8', true);
    txt('두께 약 4000 pc', xt + fs * 4.6, cy - fs * 1.4, fs, '#ffe1a8');
  }
  if (state.labels) {
    txt('태양계', X(SUN.y), Y(SUN.z) - fs * 1.8, fs + 1, '#ffd34d');
    txt('중심부 (볼록)', cx, cy - 2600 * s - fs, fs, '#ffe1a8');
    txt('원반', X(11500), cy - fs * 1.3, fs, '#bcd0ff');
    txt('헤일로 (원반을 둘러싼 공 모양 영역)', cx, cy - 19000 * s + fs * 1.2, fs, '#ffdca0');
    txt('옆에서 본 우리은하 = 중심부가 볼록한 원반 모양', cx, fs * 1.4, fs + 2, '#ffffff');
  }
}

function topXform(w, h, dpr) {
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  const scaleDev = 0.46 * Math.min(W, H) / 16500;
  return { W, H, scaleDev, s: scaleDev / dpr, cx: w / 2, cy: h / 2 };
}

function judge(g) {
  const d = Math.hypot(g.x, g.y), err = Math.abs(d - PC.SUN_R);
  let onArm = false;
  if (d > 2600) {
    const ang = Math.atan2(g.y, g.x);
    for (const a of ARMS) {
      let dt = ang - (a.t0 + KARM * Math.log(d / R0));
      dt = Math.atan2(Math.sin(dt), Math.cos(dt));
      if (Math.abs(dt) * d < 1300) onArm = true;
    }
  }
  let grade, msg;
  if (d < 3000) { grade = '😮 중심부예요'; msg = '그곳은 별이 빽빽한 중심부예요. 태양계는 중심에서 꽤 멀리 떨어져 있어요.'; }
  else if (d > 15500) { grade = '🚀 은하 밖이에요'; msg = '그곳은 우리은하 원반 바깥이에요. 조금 더 안쪽을 눌러 보세요.'; }
  else if (err <= 1000) { grade = '🎯 정확해요!'; msg = '중심에서 거리가 거의 맞았어요.'; }
  else if (err <= 2500) { grade = '👍 거의 맞아요!'; msg = d < PC.SUN_R ? '조금 더 바깥쪽이에요.' : '조금 더 안쪽이에요.'; }
  else { grade = '🔄 다시 도전!'; msg = d < PC.SUN_R ? '더 바깥쪽이에요.' : '더 안쪽이에요.'; }
  return { d: Math.round(d / 100) * 100, err: Math.round(err / 100) * 100, onArm, grade, msg };
}

function drawGame(w, h, dpr) {
  const T = topXform(w, h, dpr);
  ctx.drawImage(getRender('top', T.W, T.H, T.scaleDev), 0, 0, w, h);
  const X = (x) => T.cx + x * T.s, Y = (y) => T.cy - y * T.s;
  const fs = Math.max(13, Math.min(18, w / 50));
  if (state.scale) {
    for (const r of [5000, 10000, 15000]) {
      ctx.setLineDash([4, 8]); ctx.lineWidth = 1.8; ctx.strokeStyle = 'rgba(170,200,255,.7)';
      ctx.beginPath(); ctx.arc(T.cx, T.cy, r * T.s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      txt(r + ' pc', T.cx + r * T.s * 0.71 + 6, T.cy - r * T.s * 0.71 - 6, fs - 3, '#bcd0ff', 'left');
    }
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(T.cx - 8, T.cy); ctx.lineTo(T.cx + 8, T.cy); ctx.moveTo(T.cx, T.cy - 8); ctx.lineTo(T.cx, T.cy + 8); ctx.stroke();
  txt('태양계는 어디에 있을까? 그곳을 눌러 보세요!', w / 2, fs * 1.4, fs + 2, '#ffffff');
  if (state.reveal) {
    ctx.setLineDash([8, 6]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,211,77,.9)';
    ctx.beginPath(); ctx.arc(T.cx, T.cy, PC.SUN_R * T.s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    sunMarker(X(SUN.x), Y(SUN.y), Math.max(5, w / 140));
    txt('중심에서 약 8500 pc인 나선팔 (노란 점선 위)', T.cx, Y(-PC.SUN_R) + fs * 2.2, fs, '#ffd34d');
  }
  if (state.guess) {
    const gx = X(state.guess.x), gy = Y(state.guess.y);
    ctx.setLineDash([6, 5]); ctx.strokeStyle = '#2cb1bc'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(T.cx, T.cy); ctx.lineTo(gx, gy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#2cb1bc'; ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const r = k % 2 ? 6 : 14, a = -Math.PI / 2 + k * Math.PI / 5;
      ctx[k ? 'lineTo' : 'moveTo'](gx + r * Math.cos(a), gy + r * Math.sin(a));
    }
    ctx.closePath(); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    txt('중심에서 약 ' + judge(state.guess).d + ' pc', gx, gy - fs * 1.6, fs, '#7fe7ef');
  }
}

function skyWindow(lc, halfL, dx, dy, dw, dh) {
  const halfB = Math.min(BMAX, halfL * dh / dw);
  const gx0 = (lc - halfL + 180) / 360 * GW, gw = 2 * halfL / 360 * GW;
  const gy0 = (BMAX - halfB) / (2 * BMAX) * GH, gh = 2 * halfB / (2 * BMAX) * GH;
  ctx.save(); ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(dx, dy, dw, dh);
  ctx.imageSmoothingEnabled = true;
  const part = (sx, sw, ox, ow) => ctx.drawImage(sky.canvas, sx, gy0, sw, gh, dx + ox, dy, ow, dh);
  if (gx0 < 0) { const a = -gx0; part(GW - a, a, 0, dw * a / gw); part(0, gw - a, dw * a / gw, dw * (gw - a) / gw); }
  else if (gx0 + gw > GW) { const a = GW - gx0; part(gx0, a, 0, dw * a / gw); part(0, gw - a, dw * a / gw, dw * (gw - a) / gw); }
  else part(gx0, gw, 0, dw);
  const sc = Math.max(0.55, Math.min(1, dw / 700));
  for (const st of sky.stars) {
    let dl = st.l - lc; if (dl > 180) dl -= 360; if (dl < -180) dl += 360;
    if (Math.abs(dl) > halfL || Math.abs(st.b) > halfB) continue;
    const x = dx + dw / 2 + dl / halfL * dw / 2, y = dy + dh / 2 - st.b / halfB * dh / 2;
    ctx.beginPath(); ctx.arc(x, y, (0.5 + 1.8 * st.mag) * sc, 0, Math.PI * 2);
    ctx.fillStyle = st.warm ? `rgba(255,225,180,${0.35 + 0.6 * st.mag})` : `rgba(220,230,255,${0.35 + 0.6 * st.mag})`; ctx.fill();
  }
  ctx.restore();
}

function cone(sx, sy, lc, half, len, fill, stroke) {
  const a = -Math.PI / 2 + lc * Math.PI / 180, hw = half * Math.PI / 180;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.arc(sx, sy, len, a - hw, a + hw); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawMap(x, y, m, lc, fs) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, m, m); ctx.clip();
  ctx.fillStyle = '#05071a'; ctx.fillRect(x, y, m, m);
  if (mini) ctx.drawImage(mini, x, y, m, m);
  const ms = m / 2 / 16500, cx = x + m / 2, cy = y + m / 2;
  const sx = cx + SUN.x * ms, sy = cy - SUN.y * ms, len = m * 0.9;
  cone(sx, sy, 0, 30, len, 'rgba(244,185,66,.22)');
  cone(sx, sy, 180, 30, len, 'rgba(44,177,188,.22)');
  const isS = Math.abs(lc) < 25, isW = Math.abs(lc) > 155;
  cone(sx, sy, lc, 30, len, isS ? 'rgba(244,185,66,.45)' : isW ? 'rgba(44,177,188,.45)' : 'rgba(255,255,255,.28)', '#fff');
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(163,171,223,.5)'; ctx.strokeRect(x, y, m, m);
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  sunMarker(sx, sy, Math.max(4, m / 90));
  if (state.labels) {
    txt('은하 중심', cx + fs * 2.6, cy - fs * 0.2, fs - 1, '#fff');
    txt('태양계 (지구)', sx + fs * 3.6, sy + fs * 0.1, fs - 1, '#ffd34d');
    txt('☀️ 여름철 밤에 보는 쪽', cx, y + fs * 1.0, fs - 1, '#ffe1a8');
    txt('❄️ 겨울철 밤에 보는 쪽', cx, y + m - fs * 1.0, fs - 1, '#9fe9ef');
  }
}

function compPanel(lc, x, y, pw, ph, label, color, on, fs) {
  skyWindow(lc, 60, x, y + fs * 1.5, pw, ph - fs * 1.5);
  txt(label + ' · 밝기 ' + sky.brightness(lc), x + pw / 2, y + fs * 0.7, fs, color);
  ctx.lineWidth = on ? 4 : 1.5; ctx.strokeStyle = on ? color : 'rgba(163,171,223,.45)';
  ctx.strokeRect(x + 1, y + fs * 1.5, pw - 2, ph - fs * 1.5 - 1);
}

function drawSky(w, h) {
  if (!sky) { txt('계산하는 중…', w / 2, h / 2, 18); setTimeout(() => { sky = buildSky(); draw(); }, 30); return; }
  const fs = Math.max(12, Math.min(17, Math.min(w, h * 1.6) / 55));
  const lc = state.dir, pad = 10, gap = 12;
  const isS = Math.abs(lc) < 25, isW = Math.abs(lc) > 155;
  const title = isS ? '여름철 밤 (은하 중심 방향, 궁수자리 쪽)' : (isW ? '겨울철 밤 (은하 바깥 방향, 마차부·오리온자리 쪽)' : `은하 중심에서 ${Math.abs(Math.round(lc))}° ${lc > 0 ? '오른쪽' : '왼쪽'}`);
  let map, main, comp;
  if (w >= h * 1.15) {
    const m = Math.min(h - pad * 2 - fs * 1.6, w * 0.42);
    map = { x: pad, y: pad + fs * 1.6, m };
    const rx = pad + m + gap * 1.5, rw = w - rx - pad, top = pad + fs * 1.6;
    const mh = (h - top - pad) * 0.52;
    main = { x: rx, y: top, w: rw, h: mh };
    comp = { x: rx, y: top + mh + gap, w: rw, h: h - top - mh - gap - pad, row: true };
  } else {
    const top = pad + fs * 1.6, mh = h * 0.30;
    main = { x: pad, y: top, w: w - pad * 2, h: mh };
    const by = top + mh + gap, bh = h - by - pad, m = Math.min(bh, (w - pad * 2) * 0.5);
    map = { x: pad, y: by + fs * 1.6, m: m - fs * 1.6 };
    comp = { x: pad + m + gap, y: by, w: w - pad * 2 - m - gap, h: bh, row: false };
  }
  txt('위에서 본 모습 — 지금 어디를 보고 있을까?', map.x + map.m / 2, map.y - fs * 0.8, fs, '#fff');
  drawMap(map.x, map.y, map.m, lc, fs);
  const below = h - (map.y + map.m) - pad;
  if (below > fs * 3.2) {
    const cy0 = map.y + map.m + Math.min(below / 2, fs * 2.2);
    txt('부채꼴 = 지금 바라보는 방향', map.x + map.m / 2, cy0 - fs * 0.75, fs - 1, '#a3abdf');
    txt('별이 많은 은하 중심 쪽을 볼수록 은하수가 밝아요', map.x + map.m / 2, cy0 + fs * 0.75, fs - 1, '#ffe1a8');
  }
  txt('지금 보는 하늘 — ' + title, main.x + main.w / 2, main.y - fs * 0.8, fs, '#fff');
  skyWindow(lc, 60, main.x, main.y, main.w, main.h);
  ctx.lineWidth = 3; ctx.strokeStyle = isS ? '#f4b942' : isW ? '#2cb1bc' : '#fff'; ctx.strokeRect(main.x + 1.5, main.y + 1.5, main.w - 3, main.h - 3);
  if (comp.row) {
    const pw = (comp.w - gap) / 2;
    compPanel(0, comp.x, comp.y, pw, comp.h, '☀️ 여름철 밤', '#f4b942', isS, fs);
    compPanel(180, comp.x + pw + gap, comp.y, pw, comp.h, '❄️ 겨울철 밤', '#2cb1bc', isW, fs);
  } else {
    const ph = (comp.h - gap) / 2;
    compPanel(0, comp.x, comp.y, comp.w, ph, '☀️ 여름철 밤', '#f4b942', isS, fs);
    compPanel(180, comp.x, comp.y + ph + gap, comp.w, ph, '❄️ 겨울철 밤', '#2cb1bc', isW, fs);
  }
}

function draw() {
  const { w, h, dpr } = sizeCanvas();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  if (state.view === 'top') drawTop(w, h, dpr);
  else if (state.view === 'side') drawSide(w, h, dpr);
  else if (state.view === 'game') drawGame(w, h, dpr);
  else drawSky(w, h);
}

function makeMini() {
  const S = 640; const img = renderProjection(galView, S, S, S / 2 / 16500, (x, y) => [x, y], 0.9);
  const off = document.createElement('canvas'); off.width = S; off.height = S; off.getContext('2d').putImageData(img, 0, 0);
  return off;
}

function setPanel() {
  panel.innerHTML = TEXT[state.view] + `
    <div class="row" style="margin-top:14px">
      <label class="chk"><input type="checkbox" id="cLab" ${state.labels ? 'checked' : ''}> 이름표</label>
      <label class="chk"><input type="checkbox" id="cSca" ${state.scale ? 'checked' : ''}> 크기 표시</label>
    </div>
    <div class="note">이 시뮬레이션은 우리은하를 단순하게 나타낸 모형이에요. 별의 수와 나선팔 모양은 실제와 다를 수 있어요.</div>`;
  document.getElementById('cLab').onchange = (e) => { state.labels = e.target.checked; draw(); };
  document.getElementById('cSca').onchange = (e) => { state.scale = e.target.checked; draw(); };
  if (state.view === 'game') {
    showResult();
    document.getElementById('gReveal').onclick = () => { state.reveal = true; draw(); };
    document.getElementById('gReset').onclick = () => { state.guess = null; state.reveal = false; showResult(); draw(); };
    document.getElementById('gNext').onclick = () => { state.hist = []; state.tries = 0; state.best = null; state.guess = null; state.reveal = false; showResult(); draw(); };
  }
  if (state.view === 'sky') {
    const dir = document.getElementById('dir');
    const upd = () => {
      dir.value = state.dir;
      if (sky) { const v = sky.brightness(state.dir); document.getElementById('bval').textContent = v; document.getElementById('bbar').style.width = Math.min(100, v) + '%'; }
      draw();
    };
    dir.oninput = () => { state.dir = +dir.value; upd(); };
    document.getElementById('bSummer').onclick = () => { state.dir = 0; upd(); };
    document.getElementById('bWinter').onclick = () => { state.dir = 180; upd(); };
    if (!sky) setTimeout(() => { sky = buildSky(); upd(); }, 40); else upd();
  }
}

function showResult() {
  const el = document.getElementById('gres'); if (!el) return;
  showRecord();
  if (!state.guess) { el.innerHTML = '아직 고르지 않았어요.'; return; }
  const r = judge(state.guess);
  el.innerHTML = `<b>${r.grade}</b><br>고른 곳: 중심에서 약 <b>${r.d} pc</b><br>8500 pc와의 차이(오차): <b>${r.err} pc</b><br>${r.onArm ? '나선팔 위예요 ✔' : '나선팔 사이예요 — 밝은 팔 위를 골라 보세요'}<br>${r.msg}`;
}
function showRecord() {
  const el = document.getElementById('grec'); if (!el) return;
  const h = state.hist;
  if (!h.length) { el.innerHTML = '<b>내 기록</b><br>눌러 본 곳의 오차가 여기에 쌓여요. 친구와 비교하지 말고 처음의 나와 비교해 보세요.'; return; }
  const from = Math.max(0, h.length - 6);
  const list = h.slice(from).map((e, k) => `${from + k + 1}번째: 오차 ${e} pc`).join('<br>');
  let msg = '';
  if (h.length > 1) {
    const d = h[0] - h[h.length - 1];
    msg = d > 0 ? `처음보다 <b>${d} pc</b> 줄었어요 👏` : d === 0 ? '처음과 같아요. 점선 눈금을 보고 한 번 더 어림해 보세요.' : '처음보다 커졌어요. 5000 pc와 10000 pc 점선 사이를 다시 살펴보세요.';
  }
  el.innerHTML = `<b>내 기록</b><br>${list}<br>처음 오차 ${h[0]} pc → 가장 작은 오차 <b>${Math.min(...h)} pc</b>${msg ? '<br>' + msg : ''}`;
}
cv.addEventListener('pointerdown', (e) => {
  if (state.view !== 'game') return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const T = topXform(stage.clientWidth, stage.clientHeight, dpr);
  const x = (e.clientX - r.left - T.cx) / T.s, y = -(e.clientY - r.top - T.cy) / T.s;
  state.guess = { x, y }; state.tries++;
  const j = judge(state.guess);
  state.best = state.best === null ? j.err : Math.min(state.best, j.err);
  state.hist.push(j.err);
  showResult(); draw();
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  state.view = b.dataset.v; setPanel(); draw();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
function init() {
galView = makeGalaxy({ bulge: 6000, bar: 5000, arm: 20000, disk: 11000, halo: 650 }, 3);
mini = makeMini();
const hv = (location.hash || '').replace('#', '').split('&');
if (['top', 'side', 'sky', 'game'].includes(hv[0])) {
  state.view = hv[0];
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.v === state.view));
}
if (hv[1] && !isNaN(+hv[1])) state.dir = +hv[1];
if (hv[0] === 'game' && hv[1] && hv[1].includes(',')) {
  hv[1].split(';').forEach((p) => { const q = p.split(',').map(Number); state.guess = { x: q[0], y: q[1] }; state.hist.push(judge(state.guess).err); });
  state.tries = state.hist.length; state.best = Math.min(...state.hist); state.reveal = hv[2] === 'r';
}
setPanel(); draw();
}
(function boot() {
  const { w, h } = sizeCanvas();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  txt('우리은하를 만드는 중…', w / 2, h / 2, 18, '#a3abdf');
  setTimeout(init, 60);
})();
</script>
