<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>어디에서 보아도, 우주는 팽창한다</title>
<style>
:root{color-scheme:dark;--ink:#edf5ff;--muted:#b0bfd3;--cyan:#8ce6ed;--gold:#ffd38d;--panel:rgba(10,20,37,.92);--edge:30px;--map:420px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button,input{font:inherit}button{min-height:56px;padding:12px 22px;border:1px solid #435369;border-radius:12px;background:#17253b;color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;white-space:nowrap}button:hover{background:#293e59;border-color:var(--cyan)}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}button:disabled{opacity:.45;cursor:default}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline:none}header{position:absolute;top:var(--edge);left:var(--edge);pointer-events:none}h1{margin:0;font-size:38px;letter-spacing:-1px;white-space:nowrap}
.panel{background:var(--panel);border:1px solid #293b52;border-radius:18px}.info{position:absolute;top:var(--edge);right:var(--edge);width:330px;padding:22px}.info h2{font-size:24px;margin:0 0 18px}.scale{display:flex;justify-content:space-between;gap:12px;font-size:17px;color:var(--muted)}#scale{color:var(--cyan);font-variant-numeric:tabular-nums}.track{height:6px;margin-top:10px;border-radius:4px;background:#2b384d;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--cyan)}.speeds{display:flex;gap:8px;margin-top:18px}.speeds button{flex:1;min-height:48px;padding:8px;font-size:19px}.speeds button[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#09202c}
.measure{position:absolute;left:var(--edge);bottom:126px;width:410px;padding:22px;pointer-events:none}.measure h2{font-size:20px;color:var(--muted);margin:0 0 18px;font-weight:500}.distance-row{display:grid;grid-template-columns:80px 70px 70px 1fr;align-items:center;gap:10px;margin-top:16px;font-size:20px}.reading{text-align:right;color:var(--cyan);font-variant-numeric:tabular-nums}.distance-head{font-size:17px;color:var(--muted)}.distance-head span:not(:first-child){text-align:right}.speed-track{height:10px;border-radius:5px;background:#2b384d;overflow:hidden}.speed-track i{display:block;height:100%;background:var(--gold);border-radius:5px}
.radar{position:absolute;right:var(--edge);bottom:126px;width:calc(var(--map) + 36px);padding:18px;pointer-events:none}.radar h2{font-size:22px;margin:0 0 6px}.radar canvas{position:static;display:block;width:var(--map);height:var(--map)}.radar p{font-size:18px;color:var(--muted);margin:8px 0 0;white-space:nowrap}
.bottom{position:absolute;bottom:24px;left:var(--edge);right:var(--edge);display:flex;align-items:end;justify-content:space-between;gap:20px}.controls{display:flex;gap:10px}.controls button:first-child{background:#a7e5e7;color:#09202c;border-color:#a7e5e7}.hint{text-align:right;color:var(--muted);font-size:18px;white-space:nowrap}.jump{display:flex;align-items:center;gap:10px;margin:10px 0 0;justify-content:flex-end}.jump label{font-size:18px}.jump input{width:84px;height:48px;padding:8px;border:1px solid #435369;border-radius:10px;background:#0e192a;color:var(--ink);font-size:20px}.jump button{min-height:48px;padding:8px 18px;font-size:18px}
.question{position:absolute;top:30%;left:25%;right:26%;text-align:center;font-size:32px;line-height:1.6;font-weight:700;padding:24px;background:#071424ed;border-radius:18px;pointer-events:none;opacity:1;transition:opacity 1s}.question.gone{opacity:0}.status{position:absolute;top:90px;left:var(--edge);max-width:calc(100% - 410px);color:var(--gold);font-size:20px;pointer-events:none}.target{position:absolute;left:var(--edge);top:126px;max-width:calc(100% - 410px);color:var(--gold);font-size:20px;pointer-events:none}.target:empty{display:none}.restart{border-color:var(--gold);color:var(--gold)}
@media(max-width:1350px),(max-height:850px){:root{--edge:22px;--map:290px}h1{font-size:30px}.info{width:290px;padding:18px}.info h2{font-size:21px;margin-bottom:12px}.scale{font-size:15px}.speeds{margin-top:14px}.speeds button{font-size:17px;min-height:44px}.measure{width:360px;bottom:122px;padding:18px}.measure h2{font-size:18px;margin-bottom:14px}.distance-row{grid-template-columns:70px 60px 60px 1fr;gap:8px;font-size:18px;margin-top:13px}.distance-head{font-size:15px}.radar{padding:16px;bottom:122px;width:calc(var(--map) + 32px)}.radar h2{font-size:20px}.radar p{font-size:15px}button{font-size:18px;padding:12px 16px;min-height:52px}.hint{font-size:16px}.bottom{bottom:20px}.jump{margin-top:8px}.jump label,.jump button{font-size:16px}.question{left:30%;right:29%;font-size:25px;padding:20px}.status{top:70px;font-size:18px}.target{top:102px;font-size:18px}}
</style>
</head>
<body>
<canvas id="space" tabindex="0" aria-label="1인칭 우주 공간. 드래그나 방향키로 둘러보고 은하를 누르면 이동합니다. Tab으로 은하를 고르고 Enter로 이동합니다. Escape를 누르면 단추로 나갑니다."></canvas>
<header><h1>어디에서 보아도, 멀어지는 은하</h1></header>
<aside class="panel info"><h2 id="home">지금 내 은하: 1번</h2><div class="scale"><span id="mode">저절로 팽창하는 중</span><span id="scale">1.00배</span></div><div class="track"><i id="progress"></i></div><div class="speeds" role="group" aria-label="팽창 빠르기"><button type="button" data-speed="1" aria-pressed="true">1배속</button><button type="button" data-speed="2" aria-pressed="false">2배속</button><button type="button" data-speed="4" aria-pressed="false">4배속</button></div></aside>
<div class="status" id="status" role="status" aria-live="polite"></div>
<aside class="panel measure"><h2>가까운 은하까지의 거리 (칸)</h2><div class="distance-row distance-head"><span>은하</span><span>처음</span><span>지금</span><span>빠르기</span></div><div id="distances"></div></aside>
<aside class="panel radar"><h2>위에서 본 모습</h2><canvas id="radar" width="540" height="540" role="img" aria-label="내 은하 중심의 위에서 본 지도. 흐린 점은 처음 자리, 화살표 길이는 멀어지는 빠르기입니다."></canvas><p>화살표가 길수록 빠르게 멀어져요</p></aside>
<div class="target" id="target" role="status" aria-live="polite"></div>

<div class="bottom"><nav class="controls" aria-label="시뮬레이션 조작"><button id="pause" type="button">멈춤</button><button id="reset" type="button">처음으로</button><button id="random" type="button">다른 은하로 가기</button><button id="full" type="button">전체 화면</button></nav><div class="hint"><span>은하를 누르면 그 은하로 갑니다</span><form class="jump" id="jump"><label for="number">은하 번호</label><input id="number" type="number" min="1" max="100" value="2" inputmode="numeric" aria-label="이동할 은하 번호 1부터 100"><button type="submit">가기</button></form></div></div>
<div class="question" id="question">어느 은하에서 보아도 다른 은하들이 멀어질까?</div>
<script>
'use strict';
// 고정 좌표와 척도로 은하 사이 거리를 계산한다.
const UniverseModel = (() => {
  function random(seed) { let n = seed >>> 0; return () => { n = (Math.imul(n,1664525) + 1013904223) >>> 0; return n / 4294967296; }; }
  function createGalaxies(count = 100) {
    const rng = random(34719);
    const points = [{x:0,y:0,z:0},{x:-12,y:4,z:25},{x:14,y:-5,z:33},{x:1,y:13,z:40}];
    while (points.length < count) {
      const p = {x:(rng()-.5)*180,y:(rng()-.5)*150,z:(rng()-.5)*180};
      const r = Math.hypot(p.x,p.y,p.z);
      if (r < 44 || r > 104 || points.some(q => Math.hypot(p.x-q.x,p.y-q.y,p.z-q.z)<16)) continue;
      points.push(p);
    }
    return points.map((p,i) => Object.freeze({...p,id:i+1,size:2.5+rng()*2.5,angle:rng()*Math.PI*2,flatten:.5+rng()*.5,texture:i%9}));
  }
  function position(g,a) { return {x:g.x*a,y:g.y*a,z:g.z*a}; }
  function distance(p,q,a) { const u=position(p,a),v=position(q,a); return Math.hypot(u.x-v.x,u.y-v.y,u.z-v.z); }
  return Object.freeze({random,createGalaxies,position,distance});
})();
const galaxies = UniverseModel.createGalaxies();
const canvas = document.getElementById('space'), ctx = canvas.getContext('2d',{alpha:false});
const radar=document.getElementById('radar'),mapCtx=radar.getContext('2d');
const EXPANSION_RATE=1/10;
let playbackSpeed=1;
const speedButtons=[...document.querySelectorAll('[data-speed]')];
function setSpeed(value){playbackSpeed=value;speedButtons.forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.speed)===value)));}
speedButtons.forEach(button=>button.onclick=()=>setSpeed(Number(button.dataset.speed)));
let mapGalaxies=[],mapScale=1,mapSpeedReference=1,speedReference=1;
const ui = Object.fromEntries(['home','mode','scale','progress','status','target','distances','pause','reset','random','full','question','number'].map(id => [id,document.getElementById(id)]));
let width=0,height=0,focal=0,a=1,home=0,paused=false,ended=false,yaw=0,pitch=0;
let arrivalScale=1,travel=null,selected=-1,selectionCursor=-1,lastInteraction=0,pointer=null,visible=[],nearby=[];
let activeCount=100,lastFrame=0,windowStart=0,frameCount=0,slowWindows=0,lastHud=0,numberBuffer='',numberTime=0;
let targetYaw=null,targetPitch=0,lastSceneTime=0;
const keys = new Set(), sprites=[], rng=UniverseModel.random(8193), stars=[];
for(let i=0;i<650;i++) {const z=rng()*2-1,t=rng()*Math.PI*2,r=Math.sqrt(1-z*z);stars.push({x:r*Math.sin(t),y:z,z:r*Math.cos(t),r:.45+rng()*.9,alpha:.2+rng()*.65});}
function resize(){width=innerWidth;height=innerHeight;canvas.width=width;canvas.height=height;focal=Math.min(width*.66,height*1.13);}
addEventListener('resize',resize);resize();
// 사진과 그린 은하를 가장자리가 투명한 작은 이미지로 만든다.
function fallback(index){
  const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');g.translate(96,96);
  const halo=g.createRadialGradient(0,0,0,0,0,90);halo.addColorStop(0,'#fff2d9');halo.addColorStop(.13,'#ffe1a8df');halo.addColorStop(.4,index%2?'#b8d4ff65':'#e4c2a963');halo.addColorStop(1,'#849bd000');g.fillStyle=halo;g.fillRect(-96,-96,192,192);
  if(index%3!==0){g.globalCompositeOperation='screen';for(let arm=0;arm<3;arm++){for(let j=0;j<125;j++){const t=j/125,r=12+t*70,ang=t*5+arm*Math.PI*2/3;g.beginPath();g.fillStyle=`rgba(167,203,248,${(1-t)*.32})`;g.arc(Math.cos(ang)*r,Math.sin(ang)*r,2+t*4,0,Math.PI*2);g.fill();}}}
  return c;
}
for(let i=0;i<9;i++)sprites.push(fallback(i));
['m31','m87','ngc1275','ngc4696','ngc4889','ngc6041'].forEach((name,i)=>{
  const image=new Image();image.onload=()=>{const c=document.createElement('canvas');c.width=c.height=192;const g=c.getContext('2d');const side=Math.min(image.naturalWidth,image.naturalHeight);g.drawImage(image,(image.naturalWidth-side)/2,(image.naturalHeight-side)/2,side,side,0,0,192,192);g.globalCompositeOperation='destination-in';const m=g.createRadialGradient(96,96,22,96,96,94);m.addColorStop(0,'#fff');m.addColorStop(.55,'#fffd');m.addColorStop(1,'#fff0');g.fillStyle=m;g.fillRect(0,0,192,192);sprites[i]=c;};image.src='hubble_img/'+name+'.jpg';
});
function cameraPosition(){
  if(!travel)return UniverseModel.position(galaxies[home],a);
  const t=travel.t,s=t*t*(3-2*t),p=galaxies[travel.from],q=galaxies[travel.to];
  return {x:a*(p.x+(q.x-p.x)*s),y:a*(p.y+(q.y-p.y)*s),z:a*(p.z+(q.z-p.z)*s)};
}
function rotate(x,y,z){const c=Math.cos(yaw),s=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),rx=c*x-s*z,rz=s*x+c*z;return {x:rx,y:cp*y-sp*rz,z:sp*y+cp*rz};}
function project(v){return {x:width*.5+v.x*focal/v.z,y:height*.48-v.y*focal/v.z};}
function nearest(){return galaxies.map((g,i)=>({i,d:UniverseModel.distance(g,galaxies[home],1)})).filter(g=>g.i!==home).sort((p,q)=>p.d-q.d);}
function updateNearby(){
  const sorted=nearest();nearby=sorted.slice(0,3);
  const origin=galaxies[home];
  mapGalaxies=sorted.slice(0,12).map(item=>({...item,dx:galaxies[item.i].x-origin.x,dz:galaxies[item.i].z-origin.z}));
  mapScale=.30/Math.max(...mapGalaxies.map(g=>Math.hypot(g.dx,g.dz)));
  mapSpeedReference=Math.max(...mapGalaxies.map(g=>recessionSpeed(g)));
  speedReference=Math.max(...nearby.map(g=>g.d))*EXPANSION_RATE;
  ui.distances.innerHTML=nearby.map((g,j)=>`<div class="distance-row"><span>${g.i+1}번</span><span class="reading" id="initial${j}"></span><span class="reading" id="d${j}"></span><span class="speed-track" id="speed${j}" role="img"><i></i></span></div>`).join('');
}
function recessionSpeed(item){return item.d*a*(EXPANSION_RATE/a);}
// 고정 축척으로 처음 자리와 현재 자리, 바깥 방향의 빠르기를 그린다.
function drawRadar(){
  const c=mapCtx,size=radar.clientWidth,dpr=window.devicePixelRatio||1,pixels=Math.round(size*dpr);
  if(radar.width!==pixels||radar.height!==pixels){radar.width=pixels;radar.height=pixels;}
  c.setTransform(pixels/size,0,0,pixels/size,0,0);c.clearRect(0,0,size,size);
  const cx=size/2,cy=size/2,radius=size*.40,scale=radius*mapScale;
  c.strokeStyle='#8ce6ed30';c.lineWidth=1;
  for(const fraction of [1/3,2/3,1]){c.beginPath();c.arc(cx,cy,radius*fraction,0,Math.PI*2);c.stroke();}
  c.beginPath();c.moveTo(cx-radius,cy);c.lineTo(cx+radius,cy);c.moveTo(cx,cy-radius);c.lineTo(cx,cy+radius);c.stroke();
  for(const g of mapGalaxies){
    const x=cx+g.dx*a*scale,y=cy-g.dz*a*scale,ix=cx+g.dx*arrivalScale*scale,iy=cy-g.dz*arrivalScale*scale;
    c.strokeStyle='#8ce6ed55';c.lineWidth=1.5;c.beginPath();c.moveTo(ix,iy);c.lineTo(x,y);c.stroke();
    c.fillStyle='#b0bfd34a';c.beginPath();c.arc(ix,iy,3,0,Math.PI*2);c.fill();
  }
  for(const g of mapGalaxies){
    const x=cx+g.dx*a*scale,y=cy-g.dz*a*scale,planar=Math.hypot(g.dx,g.dz);
    if(planar>.001){
      const ux=g.dx/planar,uy=-g.dz/planar,length=radius*.20*recessionSpeed(g)/mapSpeedReference;
      const sx=x+ux*8,sy=y+uy*8,ex=sx+ux*length,ey=sy+uy*length,head=Math.min(9,length*.45);
      c.strokeStyle='#ffd38d';c.fillStyle='#ffd38d';c.lineWidth=3.5;c.lineCap='round';
      c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.stroke();
      c.beginPath();c.moveTo(ex,ey);c.lineTo(ex-ux*head-uy*head*.6,ey-uy*head+ux*head*.6);c.lineTo(ex-ux*head+uy*head*.6,ey-uy*head-ux*head*.6);c.closePath();c.fill();
    }
  }
  for(const g of mapGalaxies){
    const x=cx+g.dx*a*scale,y=cy-g.dz*a*scale;
    c.fillStyle='#c2faff';c.beginPath();c.arc(x,y,5.5,0,Math.PI*2);c.fill();
    if(nearby.some(item=>item.i===g.i)){c.font='bold 16px "Malgun Gothic",sans-serif';c.lineWidth=3;c.strokeStyle='#0a1425';c.strokeText(String(g.i+1),x+8,y-9);c.fillStyle='#edf5ff';c.fillText(String(g.i+1),x+8,y-9);}
  }
  c.fillStyle='#ffd38d';c.beginPath();c.arc(cx,cy,6,0,Math.PI*2);c.fill();c.font='bold 17px "Malgun Gothic",sans-serif';c.fillText('나',cx+9,cy+21);
}
function aim(index){const p=galaxies[home],q=galaxies[index],dx=q.x-p.x,dy=q.y-p.y,dz=q.z-p.z;targetYaw=Math.atan2(dx,dz);targetPitch=Math.atan2(dy,Math.hypot(dx,dz));}
function announce(text){ui.status.textContent=text;}
function choose(index){if(travel||index===home)return;selected=index;aim(index);lastInteraction=performance.now();ui.target.textContent=`${index+1}번 은하 선택 / Enter를 누르면 이동`;}
function fly(index){
  if(travel||index===home||index<0||index>=galaxies.length)return;
  travel={from:home,to:index,t:0};selected=-1;targetYaw=null;keys.clear();lastInteraction=performance.now();
  ui.target.textContent=`${index+1}번 은하로 이동 중`;announce('관찰 장소를 바꾸는 중입니다.');ui.random.disabled=true;
}
function arrive(){home=travel.to;travel=null;a=1;arrivalScale=1;paused=false;ended=false;ui.pause.disabled=false;ui.pause.textContent='멈춤';ui.reset.classList.remove('restart');selectionCursor=-1;updateNearby();aim(nearby[0].i);ui.home.textContent=`지금 내 은하: ${home+1}번`;ui.target.textContent='';announce('이곳에서도 은하들이 멀어집니다.');ui.random.disabled=false;lastInteraction=performance.now();updateHud();}
function randomJump(){const pool=nearest();fly(pool[Math.floor(Math.random()*pool.length)].i);}
function toggle(){if(ended){announce('3배 관찰 완료 · 다시 보려면 처음으로');return;}paused=!paused;ui.pause.textContent=paused?'계속':'멈춤';announce(paused?'팽창을 멈췄습니다. 둘러보기와 이동은 할 수 있습니다.':'팽창이 계속됩니다.');updateHud();}
function reset(){a=1;home=0;arrivalScale=1;paused=false;ended=false;travel=null;selected=-1;selectionCursor=-1;yaw=0;pitch=0;targetYaw=null;keys.clear();numberBuffer='';pointer=null;lastInteraction=performance.now();ui.home.textContent='지금 내 은하: 1번';ui.pause.textContent='멈춤';ui.pause.disabled=false;ui.random.disabled=false;ui.reset.classList.remove('restart');ui.target.textContent='';announce('처음 크기에서 다시 팽창합니다.');updateNearby();updateHud();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else announce('브라우저의 전체 화면 기능을 이용하세요.');}catch{announce('브라우저의 전체 화면 기능을 이용하세요.');}}
document.addEventListener('fullscreenchange',()=>{ui.full.textContent=document.fullscreenElement?'화면 줄이기':'전체 화면';});
ui.pause.onclick=toggle;ui.reset.onclick=reset;ui.random.onclick=randomJump;ui.full.onclick=fullscreen;
document.getElementById('jump').onsubmit=e=>{e.preventDefault();const n=Number(ui.number.value);if(Number.isInteger(n)&&n>=1&&n<=100){if(n-1===home)announce('이미 이 은하에 있습니다.');else fly(n-1);}else announce('1부터 100까지 은하 번호를 입력하세요.');};
canvas.addEventListener('pointerdown',e=>{if(pointer)return;canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};lastInteraction=performance.now();targetYaw=null;});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.hypot(e.clientX-pointer.startX,e.clientY-pointer.startY)>8)pointer.moved=true;if(pointer.moved){yaw-=dx*.004;pitch=Math.max(-1.4,Math.min(1.4,pitch+dy*.004));}pointer.x=e.clientX;pointer.y=e.clientY;lastInteraction=performance.now();});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const click=!pointer.moved;pointer=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(click){const hits=visible.filter(g=>Math.hypot(g.x-e.clientX,g.y-e.clientY)<Math.max(26,g.r*.85)).sort((p,q)=>Math.hypot(p.x-e.clientX,p.y-e.clientY)-Math.hypot(q.x-e.clientX,q.y-e.clientY));if(hits.length)fly(hits[0].i);}});
canvas.addEventListener('pointercancel',()=>{pointer=null;});
addEventListener('blur',()=>{keys.clear();pointer=null;});document.addEventListener('visibilitychange',()=>{lastFrame=0;windowStart=0;frameCount=0;keys.clear();});
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(!e.repeat)toggle();return;}
  if(e.code==='KeyR'){if(!e.repeat)reset();return;}if(e.code==='KeyN'){if(!e.repeat)randomJump();return;}if(e.code==='KeyF'){if(!e.repeat)fullscreen();return;}
  if(e.key.startsWith('Arrow')){e.preventDefault();keys.add(e.key);targetYaw=null;lastInteraction=performance.now();return;}
  if(e.key==='Escape'){selected=-1;ui.target.textContent='';targetYaw=null;ui.pause.focus();return;}
  if(e.key==='Tab'&&e.target===canvas){e.preventDefault();const list=nearest();selectionCursor=(selectionCursor+(e.shiftKey?-1:1)+list.length)%list.length;choose(list[selectionCursor].i);return;}
  if(['1','2','4'].includes(e.key)){e.preventDefault();if(!e.repeat)setSpeed(Number(e.key));return;}
  if(/^\d$/.test(e.key)){e.preventDefault();const now=performance.now();numberBuffer=now-numberTime<1400?numberBuffer+e.key:e.key;numberTime=now;const n=Number(numberBuffer);if(n>=1&&n<=100){ui.number.value=n;choose(n-1);}else{numberBuffer=e.key;const m=Number(numberBuffer);if(m>0){ui.number.value=m;choose(m-1);}}return;}
  if(e.key==='Enter'&&selected>=0&&e.target.tagName!=='BUTTON'){e.preventDefault();fly(selected);}
});
addEventListener('keyup',e=>keys.delete(e.key));
function updateHud(){ui.scale.textContent=a.toFixed(2)+'배';ui.progress.style.width=((a-1)/2*100)+'%';ui.mode.textContent=ended?'3배까지 관찰 완료':paused?'팽창을 멈춘 상태':'저절로 팽창하는 중';nearby.forEach((g,j)=>{document.getElementById('initial'+j).textContent=(g.d*arrivalScale).toFixed(1);document.getElementById('d'+j).textContent=(g.d*a).toFixed(1);const speed=recessionSpeed(g),bar=document.getElementById('speed'+j);bar.firstElementChild.style.width=(100*speed/speedReference)+'%';bar.setAttribute('aria-label','빠르기 '+speed.toFixed(1)+' (상대 값)');});}
// 화면 안의 거리표 은하 번호를 패널과 다른 이름표를 피해 그린다.
let labelBoxes=[];
function overlaps(p,q){return p.x<q.x+q.w+8&&p.x+p.w+8>q.x&&p.y<q.y+q.h+8&&p.y+p.h+8>q.y;}
function guide(item,v,p,r){
  if(v.z<=.8||p.x<0||p.x>width||p.y<0||p.y>height)return;
  const label=`${item.i+1}번`;
  ctx.font='600 20px "Malgun Gothic",sans-serif';
  const w=ctx.measureText(label).width+16,h=34,offset=Math.max(18,r*.65);
  const positions=[{x:p.x+offset,y:p.y-h/2},{x:p.x-offset-w,y:p.y-h/2},{x:p.x-w/2,y:p.y-offset-h},{x:p.x-w/2,y:p.y+offset}];
  const box=positions.map(pos=>({...pos,w,h})).find(pos=>pos.x>=12&&pos.y>=12&&pos.x+w<=width-12&&pos.y+h<=height-12&&!labelBoxes.some(other=>overlaps(pos,other)));
  if(!box)return;
  labelBoxes.push(box);ctx.fillStyle='#071322e8';ctx.fillRect(box.x,box.y,w,h);ctx.fillStyle='#c2f3f3';ctx.fillText(label,box.x+8,box.y+24);
}
function render(now,dt){
  ctx.fillStyle='#030712';ctx.fillRect(0,0,width,height);
  const glow=ctx.createRadialGradient(width*.5,height*.48,0,width*.5,height*.48,width*.65);glow.addColorStop(0,'#101e37');glow.addColorStop(.55,'#080f20');glow.addColorStop(1,'#030712');ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);
  for(const s of stars){const v=rotate(s.x,s.y,s.z);if(v.z<=.05)continue;const p=project(v);if(p.x<0||p.x>width||p.y<0||p.y>height)continue;ctx.fillStyle=`rgba(207,222,245,${s.alpha})`;ctx.fillRect(p.x,p.y,s.r,s.r);}
  const camera=cameraPosition(),must=new Set([home,...nearby.map(g=>g.i),selected]);if(travel)must.add(travel.to);
  const list=[];visible=[];
  galaxies.forEach((g,i)=>{if((i>=activeCount&&!must.has(i))||(!travel&&i===home))return;const world=UniverseModel.position(g,a),v=rotate(world.x-camera.x,world.y-camera.y,world.z-camera.z);if(v.z<=.8)return;const p=project(v),r=Math.min(210,g.size*focal/v.z);if(p.x+r<0||p.x-r>width||p.y+r<0||p.y-r>height)return;list.push({...p,r,z:v.z,i});});
  list.sort((p,q)=>q.z-p.z);
  for(const p of list){const g=galaxies[p.i];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(g.angle);ctx.scale(1,g.flatten);ctx.globalCompositeOperation='screen';ctx.drawImage(sprites[g.texture],-p.r,-p.r,p.r*2,p.r*2);ctx.restore();visible.push(p);
  }
  labelBoxes=[...document.querySelectorAll('header,.panel,.bottom,.status,.target,.question:not(.gone)')].filter(el=>el.textContent.trim()).map(el=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height};});
  if(!travel)nearby.forEach((item,index)=>{const g=galaxies[item.i],v=rotate((g.x-galaxies[home].x)*a,(g.y-galaxies[home].y)*a,(g.z-galaxies[home].z)*a),p=v.z>.4?project(v):{x:0,y:0};guide(item,v,p,Math.min(210,g.size*focal/Math.max(.8,v.z)),index);});
  ctx.strokeStyle='#b0d8e144';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(width*.5-7,height*.48);ctx.lineTo(width*.5+7,height*.48);ctx.moveTo(width*.5,height*.48-7);ctx.lineTo(width*.5,height*.48+7);ctx.stroke();
}
function frame(now){
  const dt=lastFrame?Math.min((now-lastFrame)/1000,.08):0;lastFrame=now;
  if(!paused&&!ended&&!travel){a=Math.min(3,a+dt*EXPANSION_RATE*playbackSpeed);if(a>=3){ended=true;ui.pause.disabled=true;ui.pause.textContent='관찰 완료';ui.reset.classList.add('restart');announce('3배 관찰 완료 · 다시 보려면 처음으로');}}
  if(travel){travel.t=Math.min(1,travel.t+dt/2.6);if(travel.t>=1)arrive();}
  const look=dt*.65;if(keys.has('ArrowLeft'))yaw-=look;if(keys.has('ArrowRight'))yaw+=look;if(keys.has('ArrowUp'))pitch+=look;if(keys.has('ArrowDown'))pitch-=look;pitch=Math.max(-1.4,Math.min(1.4,pitch));
  if(keys.size)lastInteraction=now;
  if(targetYaw!==null&&!travel){const delta=Math.atan2(Math.sin(targetYaw-yaw),Math.cos(targetYaw-yaw)),f=1-Math.exp(-dt*3);yaw+=delta*f;pitch+=(targetPitch-pitch)*f;if(Math.abs(delta)<.003&&Math.abs(targetPitch-pitch)<.003)targetYaw=null;}
  else if(!pointer&&!keys.size&&!travel&&selected<0&&now-lastInteraction>7000)yaw+=dt*.018;
  render(now,dt);drawRadar();lastSceneTime=now;
  if(now-lastHud>100){updateHud();lastHud=now;}
  if(!document.hidden){if(!windowStart)windowStart=now;frameCount++;if(now-windowStart>3000){const fps=frameCount*1000/(now-windowStart);slowWindows=fps<45?slowWindows+1:0;if(slowWindows>=2&&activeCount>60){activeCount=Math.max(60,activeCount-10);slowWindows=0;}windowStart=now;frameCount=0;}}
  requestAnimationFrame(frame);
}
updateNearby();updateHud();canvas.focus({preventScroll:true});setTimeout(()=>ui.question.classList.add('gone'),3000);requestAnimationFrame(frame);
</script>
